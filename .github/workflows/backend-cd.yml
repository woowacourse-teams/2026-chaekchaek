name: Backend CD (Deploy to EC2)

on:
  push:
    branches: [ be ]
    paths:
      - 'backend/**'
  workflow_dispatch:

concurrency:
  group: backend-cd
  cancel-in-progress: false

defaults:
  run:
    working-directory: backend

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'liberica'
          java-version: '21'

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build bootJar (테스트 포함 — RestDocs 스니펫 필요)
        run: ./gradlew clean bootJar

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: backend/build/libs/*.jar
          retention-days: 1

  deploy:
    needs: build
    runs-on: [ self-hosted, backend ]
    steps:
      - name: Checkout (Dockerfile 확보용)
        uses: actions/checkout@v4

      - name: Download jar artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-jar
          path: backend/build/libs

      - name: Build Docker image
        run: docker build -t chaekchaek-backend .

      - name: Restart container
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          ALADIN_TTB_KEY: ${{ secrets.ALADIN_TTB_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          FRONTEND_BASE_URL: ${{ secrets.FRONTEND_BASE_URL }}
          FRONTEND_ALLOWED_ORIGINS: ${{ secrets.FRONTEND_ALLOWED_ORIGINS }}
        run: |
          docker stop chaekchaek-backend 2>/dev/null || true
          docker rm chaekchaek-backend 2>/dev/null || true
          docker run -d \
            --name chaekchaek-backend \
            --restart unless-stopped \
            -p 8080:8080 \
            -e DB_URL="$DB_URL" \
            -e DB_USERNAME="$DB_USERNAME" \
            -e DB_PASSWORD="$DB_PASSWORD" \
            -e ALADIN_TTB_KEY="$ALADIN_TTB_KEY" \
            -e JWT_SECRET="$JWT_SECRET" \
            -e GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" \
            -e GOOGLE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET" \
            -e FRONTEND_BASE_URL="$FRONTEND_BASE_URL" \
            -e FRONTEND_ALLOWED_ORIGINS="$FRONTEND_ALLOWED_ORIGINS" \
            chaekchaek-backend
          docker image prune -f
