name: Backend CD (Deploy to EC2)

on:
  push:
    branches: [ be ]
    paths:
      - 'backend/**'
  workflow_dispatch:

concurrency:
  group: backend-cd
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/chaekchaek-backend

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'liberica'
          java-version: '21'

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build bootJar (테스트 포함 — RestDocs 스니펫 필요)
        run: ./gradlew clean bootJar

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:dev-${{ github.sha }}

  deploy:
    needs: build
    runs-on: [ self-hosted, dev-backend ]
    environment: development
    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy development
        shell: bash
        env:
          BACKEND_IMAGE: ghcr.io/woowacourse-teams/2026-chaekchaek/chaekchaek-backend:dev-${{ github.sha }}
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          MYSQL_DATABASE: ${{ secrets.MYSQL_DATABASE }}
          MYSQL_USER: ${{ secrets.MYSQL_USER }}
          MYSQL_PASSWORD: ${{ secrets.MYSQL_PASSWORD }}
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          FRONTEND_BASE_URL: ${{ secrets.FRONTEND_BASE_URL }}
          FRONTEND_LOCAL_BASE_URL: ${{ secrets.FRONTEND_LOCAL_BASE_URL }}
          FRONTEND_DEV_BASE_URL: ${{ secrets.FRONTEND_DEV_BASE_URL }}
          FRONTEND_ALLOWED_ORIGINS: ${{ secrets.FRONTEND_ALLOWED_ORIGINS }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          APPLE_CLIENT_ID: ${{ secrets.APPLE_CLIENT_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          ALADIN_TTB_KEY: ${{ secrets.ALADIN_TTB_KEY }}
          YES24_API_KEY: ${{ secrets.YES24_API_KEY }}
          AUTH_COOKIE_SECURE: "true"
          AUTH_COOKIE_SAME_SITE: "None"

        run: |
          set -euo pipefail

          cd /opt/chaekchaek
          umask 077

          env_file="$(mktemp .env.dev.XXXXXX)"
          trap 'rm -f "$env_file"' EXIT

          {
            printf '%s\n' "BACKEND_IMAGE=$BACKEND_IMAGE"
            printf '%s\n' "DB_URL=$DB_URL"
            printf '%s\n' "DB_USERNAME=$DB_USERNAME"
            printf '%s\n' "DB_PASSWORD=$DB_PASSWORD"
            printf '%s\n' "MYSQL_DATABASE=$MYSQL_DATABASE"
            printf '%s\n' "MYSQL_USER=$MYSQL_USER"
            printf '%s\n' "MYSQL_PASSWORD=$MYSQL_PASSWORD"
            printf '%s\n' "MYSQL_ROOT_PASSWORD=$MYSQL_ROOT_PASSWORD"
            printf '%s\n' "FRONTEND_BASE_URL=$FRONTEND_BASE_URL"
            printf '%s\n' "FRONTEND_LOCAL_BASE_URL=$FRONTEND_LOCAL_BASE_URL"
            printf '%s\n' "FRONTEND_DEV_BASE_URL=$FRONTEND_DEV_BASE_URL"
            printf '%s\n' "FRONTEND_ALLOWED_ORIGINS=$FRONTEND_ALLOWED_ORIGINS"
            printf '%s\n' "GOOGLE_CLIENT_ID=$GOOGLE_CLIENT_ID"
            printf '%s\n' "GOOGLE_CLIENT_SECRET=$GOOGLE_CLIENT_SECRET"
            printf '%s\n' "APPLE_CLIENT_ID=$APPLE_CLIENT_ID"
            printf '%s\n' "APPLE_TEAM_ID=$APPLE_TEAM_ID"
            printf '%s\n' "APPLE_KEY_ID=$APPLE_KEY_ID"
            printf '%s\n' "APPLE_PRIVATE_KEY=$APPLE_PRIVATE_KEY"
            printf '%s\n' "JWT_SECRET=$JWT_SECRET"
            printf '%s\n' "ALADIN_TTB_KEY=$ALADIN_TTB_KEY"
            printf '%s\n' "YES24_API_KEY=$YES24_API_KEY"
            printf '%s\n' "AUTH_COOKIE_SECURE=$AUTH_COOKIE_SECURE"
            printf '%s\n' "AUTH_COOKIE_SAME_SITE=$AUTH_COOKIE_SAME_SITE"
          } > "$env_file"

          chmod 600 "$env_file"
          mv "$env_file" .env.dev

          docker compose --env-file .env.dev pull
          docker compose --env-file .env.dev up -d --remove-orphans
          docker compose --env-file .env.dev ps

          curl -fsS https://dev-api.chaekchaek.com/health