name: Backend CD (Deploy to EC2)

on:
  push:
    branches: [ be ]
    paths:
      - 'backend/**'
  workflow_dispatch:

concurrency:
  group: backend-cd
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/chaekchaek-backend

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'liberica'
          java-version: '21'

      - name: Setup Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Build bootJar (테스트 포함 — RestDocs 스니펫 필요)
        run: ./gradlew clean bootJar

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: backend
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    needs: build
    runs-on: [ self-hosted, backend ]
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull image
        run: docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Restart container
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          ALADIN_TTB_KEY: ${{ secrets.ALADIN_TTB_KEY }}
          YES24_API_KEY: ${{ secrets.YES24_API_KEY }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          FRONTEND_BASE_URL: ${{ secrets.FRONTEND_BASE_URL }}
          FRONTEND_LOCAL_BASE_URL: ${{ secrets.FRONTEND_LOCAL_BASE_URL }}
          FRONTEND_DEV_BASE_URL: ${{ secrets.FRONTEND_DEV_BASE_URL }}
          FRONTEND_ALLOWED_ORIGINS: ${{ secrets.FRONTEND_ALLOWED_ORIGINS }}
          APPLE_CLIENT_ID: ${{ secrets.APPLE_CLIENT_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_KEY_ID: ${{ secrets.APPLE_KEY_ID }}
          APPLE_PRIVATE_KEY: ${{ secrets.APPLE_PRIVATE_KEY }}
          AUTH_COOKIE_SECURE: 'true'
          AUTH_COOKIE_SAME_SITE: 'None'
        run: |
          docker stop chaekchaek-backend 2>/dev/null || true
          docker rm chaekchaek-backend 2>/dev/null || true
          docker run -d \
            --name chaekchaek-backend \
            --restart unless-stopped \
            -p 8080:8080 \
            -e DB_URL="$DB_URL" \
            -e DB_USERNAME="$DB_USERNAME" \
            -e DB_PASSWORD="$DB_PASSWORD" \
            -e ALADIN_TTB_KEY="$ALADIN_TTB_KEY" \
            -e YES24_API_KEY="$YES24_API_KEY" \
            -e JWT_SECRET="$JWT_SECRET" \
            -e GOOGLE_CLIENT_ID="$GOOGLE_CLIENT_ID" \
            -e GOOGLE_CLIENT_SECRET="$GOOGLE_CLIENT_SECRET" \
            -e FRONTEND_BASE_URL="$FRONTEND_BASE_URL" \
            -e FRONTEND_LOCAL_BASE_URL="$FRONTEND_LOCAL_BASE_URL" \
            -e FRONTEND_DEV_BASE_URL="$FRONTEND_DEV_BASE_URL" \
            -e FRONTEND_ALLOWED_ORIGINS="$FRONTEND_ALLOWED_ORIGINS" \
            -e AUTH_COOKIE_SECURE="$AUTH_COOKIE_SECURE" \
            -e AUTH_COOKIE_SAME_SITE="$AUTH_COOKIE_SAME_SITE" \
            -e APPLE_CLIENT_ID="$APPLE_CLIENT_ID" \
            -e APPLE_TEAM_ID="$APPLE_TEAM_ID" \
            -e APPLE_KEY_ID="$APPLE_KEY_ID" \
            -e APPLE_PRIVATE_KEY="$APPLE_PRIVATE_KEY" \
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          docker image prune -af
