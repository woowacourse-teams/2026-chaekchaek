name: frontend-deploy
on:
  push:
    branches:
      - fe
    paths:
      - 'frontend/**'
      - '.github/workflows/frontend-deploy.yml'

jobs:
  deploy:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend
    
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.18.1

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build -w @chaekchaek/web

      - name: Setup SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          sudo ssh-keyscan -H "${{ vars.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy to EC2
        run: |
          scp -i ~/.ssh/ec2_key -r apps/chaekchaek/dist/. "${{ vars.EC2_USER }}@${{ vars.EC2_HOST }}:/var/www/chaekchaek-frontend/"
