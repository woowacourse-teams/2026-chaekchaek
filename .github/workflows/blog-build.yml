name: Build team blog

on:
  pull_request:
    branches: [blog]
    paths:
      - team-blog/**
      - .github/workflows/blog-build.yml
      - .github/workflows/blog-deploy.yml

permissions:
  contents: read

jobs:
  build:
    name: Build Docusaurus
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: team-blog

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: team-blog/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check the site
        run: npm run typecheck

      - name: Build the site
        run: npm run build
