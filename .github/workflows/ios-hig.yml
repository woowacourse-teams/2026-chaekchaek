name: iOS HIG

on:
  pull_request:
    paths:
      - "android/iosApp/**"
      - "android/shared/src/commonMain/kotlin/com/chaekchaek/app/ui/**"
      - "android/shared/src/iosMain/**"
      - "android/shared/build.gradle.kts"
      - "android/gradle/**"
      - "android/scripts/**"
      - ".agents/skills/chaekchaek-design-system/**"
      - ".agents/skills/ios-simulator-validation/**"
      - ".codex/hooks.json"
      - ".codex/hooks/**"
      - ".github/workflows/ios-hig.yml"
  push:
    branches:
      - main
      - an-develop
    paths:
      - "android/iosApp/**"
      - "android/shared/src/commonMain/kotlin/com/chaekchaek/app/ui/**"
      - "android/shared/src/iosMain/**"
      - "android/shared/build.gradle.kts"
      - "android/gradle/**"
      - "android/scripts/**"
      - ".agents/skills/chaekchaek-design-system/**"
      - ".agents/skills/ios-simulator-validation/**"
      - ".codex/hooks.json"
      - ".codex/hooks/**"
      - ".github/workflows/ios-hig.yml"

permissions:
  contents: read

jobs:
  accessibility-audit:
    name: iOS accessibility audit
    runs-on: macos-15
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Check HIG guard
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          python3 .codex/hooks/chaekchaek-design-system-guard.py --self-test
          python3 .codex/hooks/chaekchaek-design-system-guard.py --check-diff "$BASE_SHA"
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Select Xcode 16.4
        run: sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer
      - name: Test HIG accessibility
        run: |
          device_id="$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          print(next(
              device["udid"]
              for runtime, entries in devices.items()
              if runtime.endswith("iOS-18-5")
              for device in entries
              if device["name"] == "iPhone 16 Pro"
          ))
          ')"
          xcrun simctl boot "$device_id"
          trap 'xcrun simctl shutdown "$device_id" || true' EXIT
          xcrun simctl bootstatus "$device_id" -b

          for content_size in large accessibility-extra-extra-extra-large; do
            xcrun simctl ui "$device_id" content_size "$content_size"
            xcodebuild test \
              -project android/iosApp/iosApp.xcodeproj \
              -scheme Chaekchaek \
              -destination "platform=iOS Simulator,id=$device_id" \
              -only-testing:ChaekchaekUITests \
              -parallel-testing-enabled NO \
              -maximum-concurrent-test-simulator-destinations 1 \
              -derivedDataPath "$RUNNER_TEMP/ChaekchaekDerivedData" \
              CODE_SIGNING_ALLOWED=NO
          done
