name: Request Codex Review

# 저장소 기본 브랜치에 반영한 뒤 사용한다. Codex 자체 자동 리뷰는 꺼서 중복 실행을 막는다.
on:
  pull_request_target:
    branches: [be-dev]
    types: [opened, ready_for_review, reopened, edited]

permissions:
  pull-requests: write

concurrency:
  group: request-codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  request-review:
    if: >-
      github.event.pull_request.draft == false &&
      (github.event.action != 'edited' || github.event.changes.base != null)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # 댓글 작성만 수행한다. pull_request_target에서 PR 코드를 checkout하거나 실행하지 않는다.
      - name: Request the first Codex review
        uses: actions/github-script@v7
        with:
          # 봇 댓글로 Codex가 실행되지 않으면 연결된 사용자의 PAT를 이 secret에 등록한다.
          # PAT는 이 저장소의 Pull requests 읽기, 쓰기 권한만 부여한다.
          github-token: ${{ secrets.CODEX_REVIEW_TOKEN || github.token }}
          script: |
            const { owner, repo } = context.repo;
            const pullNumber = context.payload.pull_request.number;
            const marker = '<!-- codex-initial-review-request -->';

            // 대기 중 Draft 전환, 종료, 대상 브랜치 변경이 발생했는지 최신 상태를 확인한다.
            const { data: pullRequest } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: pullNumber,
            });
            if (pullRequest.state !== 'open' || pullRequest.draft || pullRequest.base.ref !== 'be-dev') {
              core.info('열려 있는 리뷰 가능 상태의 be-dev 대상 PR이 아니므로 건너뜁니다.');
              return;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pullNumber,
              per_page: 100,
            });
            const alreadyRequested = comments.some(({ body }) => {
              const text = (body ?? '').trim();
              return text.includes(marker) || /^@codex\s+review\b/i.test(text);
            });
            if (alreadyRequested) {
              core.info('기존 Codex 리뷰 요청이 있어 건너뜁니다. 재리뷰는 수동으로 요청합니다.');
              return;
            }

            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pullNumber,
              body: `@codex review\n\n${marker}`,
            });
            core.info('최초 Codex 리뷰 요청 댓글을 작성했습니다.');
