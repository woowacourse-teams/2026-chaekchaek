name: PR template

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

jobs:
  validate:
    name: Validate PR template
    runs-on: ubuntu-latest
    steps:
      - name: Validate required sections
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          for section in '구현 내용' '디자인' '미구현·제외' '검증'; do
            if ! printf '%s\n' "$PR_BODY" | grep -Fxq "## $section"; then
              echo "누락된 PR 템플릿 섹션: ## $section"
              exit 1
            fi
          done
