        description: 정렬 기준. 생략하면 RECENT를 사용한다
        required: false
        schema: {type: string}
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/api-v1-members-memberId-library-2095782657'}
              examples:
                public-library-list: {value: '{"member":{"memberId":1,"displayName":"책책이","profileImageUrl":"https://example.com/profile.jpg"},"totalCount":1,"filteredCount":1,"nextPage":null,"items":[{"bookId":10,"isbn13":"9788936433598","title":"채식주의자","coverImageUrl":"https://image.aladin.co.kr/cover.jpg","authors":["한강"],"translators":[],"publisher":"창비","category":"국내도서>소설","publishedDate":"2007-10-30","totalPages":368,"commentCount":2,"status":"READING","currentPage":100,"rating":4.5}]}'}
