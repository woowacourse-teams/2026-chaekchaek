openapi: 3.0.1
info:
  title: ChaekChaek API
  description: |-
    ChaekChaek 웹·모바일 클라이언트를 위한 REST API입니다.

    ## Swagger 이용 안내
    - 운영 Swagger는 API 계약 확인을 위한 읽기 전용 문서입니다.
    - Try it out은 GET 요청만 지원합니다.
    - Swagger UI에서는 쿠키와 Authorization 헤더를 전송하지 않습니다.
    - 인증이 필요한 API의 실행은 개발·QA 환경 또는 별도 API 클라이언트를 사용합니다.

    ## 웹 인증
    - OAuth 로그인 성공 후 `access_token`, `refresh_token` 쿠키를 사용합니다.
    - 보호된 API는 `access_token` 쿠키 또는 `Authorization: Bearer {accessToken}` 헤더로 인증할 수 있습니다.
    - 웹 토큰 재발급과 로그아웃은 `refresh_token` 쿠키를 사용합니다.

    ## 모바일 인증
    - Google SDK에서 받은 ID Token을 모바일 로그인 API에 전달합니다.
    - 응답의 Access Token은 `Authorization: Bearer {accessToken}` 헤더로 전달합니다.
    - `accessTokenExpiresIn`, `refreshTokenExpiresIn`의 단위는 초입니다.
    - 모바일 토큰 재발급 시 기존 Refresh Token은 폐기되고 새 토큰이 발급됩니다.

    ## 게스트 인증
    - `POST /api/v1/auth/guest-token`으로 90일간 유효한 게스트 토큰과 작성자 닉네임을 발급받습니다.
    - 토큰 만료까지 14일 이하로 남으면 `POST /api/v1/auth/guest-token/refresh`에 현재 `X-Guest-Token`을 전달해 같은 Actor의 토큰을 갱신합니다.
    - 갱신 성공 시 새 토큰의 유효기간은 다시 90일이며 기존 토큰은 즉시 무효화됩니다.
    - 감상·답글의 작성, 수정, 삭제와 좋아요 등록, 취소 요청에는 `X-Guest-Token: {guestToken}` 헤더를 사용할 수 있습니다.
    - 서재, 별점, 독서 상태, 쪽수는 회원 전용 기능입니다.
    - 게스트가 최초 소셜 회원가입할 때 같은 게스트 토큰을 전달하면 기존 Actor와 닉네임 및 공개 상호작용이 계승됩니다.
    - 토큰이 유실되거나 만료되면 기존 게스트 콘텐츠를 수정하거나 삭제할 수 없습니다.

    ## 오류 처리
    - 클라이언트의 오류 분기에는 ProblemDetail의 `code`를 사용합니다.
    - `detail`은 사용자 표시 또는 디버깅 참고용이며 분기 기준으로 사용하지 않습니다.
    - `type`은 현재 `about:blank`으로 고정됩니다.
  version: local
servers:
- {url: ..}
tags: []
paths:
  /api/v1/books:
    get:
      tags: [도서]
      summary: 도서 검색
      description: 도서명과 페이지 번호 및 정렬 기준으로 도서를 검색한다
      operationId: book-search
      parameters:
      - name: query
        in: query
        description: 검색할 도서명
        required: true
        schema: {type: string}
      - name: page
        in: query
        description: 1부터 시작하는 페이지 번호
        required: true
        schema: {type: integer, format: int32, minimum: 1}
      - name: sort
        in: query
        description: 정렬 기준. TITLE_ASC는 이름 오름차순, TITLE_DESC는 이름 내림차순, OLDEST는 오래된순,
          LATEST는 최신순, REVIEW는 감상 많은 순, COMMENT는 댓글순이며 생략하면 LATEST를 사용한다
        required: false
        schema:
          type: string
          enum: [LATEST, COMMENT]
          default: LATEST
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/api-v1-books1370717732'}
              examples:
                book-search: {value: '{"totalCount":1,"nextPage":null,"items":[{"bookId":null,"title":"마션","coverImageUrl":"https://image.aladin.co.kr/martian.jpg","authors":["앤디
                    위어"],"translators":["박아람"],"publishedDate":"2026-07-01","isbn13":"9788925568683","category":"국내도서>소설>과학소설","publisher":"알에이치코리아(RHK)","reviewCount":null,"replyCount":null,"isRegisteredInMyLibrary":null}]}'}
                search-registered-book:
                  summary: 서재에 등록된 도서
                  value:
                    totalCount: 1
                    nextPage: null
                    items:
                    - bookId: 10
                      title: 채식주의자
                      coverImageUrl: https://example.com/book.jpg
                      authors: [한강]
                      translators: []
                      publishedDate: '2007-10-30'
                      isbn13: '9788936433598'
                      category: 국내도서>소설
                      publisher: 창비
                      reviewCount: 1
                      replyCount: 1
                      isRegisteredInMyLibrary: true
                search-unregistered-book:
                  summary: 서재에 등록하지 않은 도서
                  value:
                    totalCount: 1
                    nextPage: null
                    items:
                    - bookId: null
                      title: 마션
                      coverImageUrl: https://example.com/book.jpg
                      authors: [앤디 위어]
                      translators: []
                      publishedDate: '2015-07-10'
                      isbn13: '9788925568683'
                      category: 국내도서>소설
                      publisher: 알에이치코리아
                      reviewCount: null
                      replyCount: null
                      isRegisteredInMyLibrary: false
                search-guest-book:
                  summary: 비로그인 사용자의 도서 검색
                  value:
                    totalCount: 1
                    nextPage: null
                    items:
                    - bookId: null
                      title: 마션
                      coverImageUrl: https://example.com/book.jpg
                      authors: [앤디 위어]
                      translators: []
                      publishedDate: '2015-07-10'
                      isbn13: '9788925568683'
                      category: 국내도서>소설
                      publisher: 알에이치코리아
                      reviewCount: null
                      replyCount: null
                      isRegisteredInMyLibrary: null
        '400':
          description: '400'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples:
                book-search-invalid-request: {value: '{"detail":"요청값이 올바르지 않습니다.","instance":"/api/v1/books","status":400,"title":"Bad
                    Request","type":"about:blank","code":"INVALID_REQUEST"}'}
        '500':
          description: '500'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples:
                book-search-internal-server-error: {value: '{"detail":"서버 내부 오류가 발생했습니다.","instance":"/api/v1/books","status":500,"title":"Internal
                    Server Error","type":"about:blank","code":"INTERNAL_SERVER_ERROR"}'}
        '502':
          description: '502'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples:
                book-search-external-api-error: {value: '{"detail":"외부 서비스 호출에 실패했습니다.","instance":"/api/v1/books","status":502,"title":"Bad
                    Gateway","type":"about:blank","code":"EXTERNAL_API_ERROR"}'}
  /api/v1/library:
    get:
      tags: [내 서재]
      summary: 내 서재 조회
      description: |-
        인증된 사용자가 읽기 상태와 정렬 기준으로 내 서재를 조회한다

        `page`는 1부터 시작하고 한 페이지에 최대 10개입니다. 마지막 페이지의 `nextPage`는 `null`이며, 범위를 벗어난 페이지도 200과 빈 `items`로 응답합니다. 같은 정렬 값의 항목은 일관된 순서로 반환됩니다.
      operationId: library-list
      parameters:
      - name: page
        in: query
        description: 1부터 시작하는 페이지 번호
        required: true
        schema: {type: integer, format: int32, minimum: 1}
      - name: status
        in: query
        description: 필터할 읽기 상태. 생략하면 전체 상태를 조회한다
        required: false
        schema:
          type: string
          enum: [WANT_TO_READ, READING, FINISHED]
      - name: sort
        in: query
        description: 정렬 기준. 생략하면 RECENT를 사용한다
        required: false
        schema:
          type: string
          enum: [RECENT, OLDEST, COMMENT, RATING, TITLE]
          default: RECENT
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/api-v1-library2055718325'}
              examples:
                library-list: {value: '{"totalCount":3,"filteredCount":2,"nextPage":2,"items":[{"bookId":10,"isbn13":"9788936433598","title":"채식주의자","coverImageUrl":"https://image.aladin.co.kr/cover.jpg","authors":["한강"],"translators":[],"publisher":"창비","category":"국내도서>소설","publishedDate":"2007-10-30","totalPages":368,"commentCount":2,"status":"READING","currentPage":100,"rating":4.5,"addedAt":"2026-08-14T03:00:00Z","readingUpdatedAt":"2026-08-14T03:30:00Z"}]}'}
        '400':
          description: '400'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples:
                library-list-invalid-request: {value: '{"detail":"요청값이 올바르지 않습니다.","instance":"/api/v1/library","status":400,"title":"Bad
                    Request","type":"about:blank","code":"INVALID_REQUEST"}'}
        '401':
          description: '401'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples:
                library-list-unauthorized: {value: '{"detail":"인증이 필요합니다.","instance":"/api/v1/library","status":401,"title":"Unauthorized","type":"about:blank","code":"UNAUTHORIZED"}'}
      security: &id001
      - &id002
        bearerAuth: []
      - &id003
        accessTokenCookie: []
    post:
      tags: [내 서재]
      summary: 내 서재에 도서 추가
      description: 인증된 사용자가 ISBN-13으로 도서를 조회해 내 서재에 추가한다
      operationId: library-add
      requestBody:
        content:
          application/json;charset=UTF-8:
            schema: {$ref: '#/components/schemas/api-v1-library923669369'}
            examples:
              library-add-book-not-found:
                value: |
                  {"isbn13":"9788936433598","status":"READING","totalPages":368}
              library-add-invalid-reading-state:
                value: |
                  {"isbn13":"9788936433598","status":"READING","totalPages":368}
              library-add-unauthorized:
                value: |
                  {"isbn13":"9788936433598","status":"READING","totalPages":368}
              library-add-already-exists:
                value: |
                  {"isbn13":"9788936433598","status":"READING","totalPages":368}
              library-add-total-pages-conflict:
                value: |
                  {"isbn13":"9788936433598","status":"READING","totalPages":368}
              library-add-invalid-request:
                value: |
                  {"isbn13":"9788936433598","status":"READING","totalPages":368}
              library-add:
                value: |
                  {"isbn13":"9788936433598","status":"READING","totalPages":368}
      responses:
        '404':
          description: '404'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples:
                library-add-book-not-found: {value: '{"detail":"책을 찾을 수 없습니다.","instance":"/api/v1/library","status":404,"title":"Not
                    Found","type":"about:blank","code":"BOOK_NOT_FOUND"}'}
        '422':
          description: '422'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples:
                library-add-invalid-reading-state: {value: '{"detail":"현재 읽기 상태에서는
                    요청을 처리할 수 없습니다.","instance":"/api/v1/library","status":422,"title":"Unprocessable
                    Content","type":"about:blank","code":"INVALID_READING_STATE"}'}
        '401':
          description: '401'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples:
                library-add-unauthorized: {value: '{"detail":"인증이 필요합니다.","instance":"/api/v1/library","status":401,"title":"Unauthorized","type":"about:blank","code":"UNAUTHORIZED"}'}
        '409':
          description: '409'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples:
                library-add-already-exists: {value: '{"detail":"이미 서재에 등록된 책입니다.","instance":"/api/v1/library","status":409,"title":"Conflict","type":"about:blank","code":"LIBRARY_ITEM_ALREADY_EXISTS"}'}
                library-add-total-pages-conflict: {value: '{"detail":"전체 페이지 수가 기존
                    정보와 다릅니다.","instance":"/api/v1/library","status":409,"title":"Conflict","type":"about:blank","code":"TOTAL_PAGES_CONFLICT"}'}
        '400':
          description: '400'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples:
                library-add-invalid-request: {value: '{"detail":"요청값이 올바르지 않습니다.","instance":"/api/v1/library","status":400,"title":"Bad
                    Request","type":"about:blank","code":"INVALID_REQUEST"}'}
        '201':
          description: '201'
          headers:
            Location:
              description: 생성된 내 서재 항목 URI
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/api-v1-library-bookId-rating-1519410846'}
              examples:
                library-add: {value: '{"bookId":10,"isbn13":"9788936433598","title":"채식주의자","coverImageUrl":"https://image.aladin.co.kr/cover.jpg","authors":["한강"],"translators":[],"publisher":"창비","category":"국내도서>소설","publishedDate":"2007-10-30","totalPages":368,"commentCount":2,"status":"READING","currentPage":100,"rating":4.5,"addedAt":"2026-08-14T03:00:00Z","readingUpdatedAt":"2026-08-14T03:30:00Z"}'}
      security: *id001
  /api/v1/admin/recommended-books:
    get:
      tags: [관리자]
      summary: 추천 도서 목록 조회
      description: 관리자가 지정한 추천 도서를 최근에 추천한 순서로 조회한다. 추천한 책이 없으면 빈 배열을 반환한다
      operationId: admin-recommended-books
      responses:
        '403':
          description: '403'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples:
                admin-recommended-books-forbidden: {value: '{"detail":"요청한 작업을 수행할
                    권한이 없습니다.","instance":"/api/v1/admin/recommended-books","status":403,"title":"Forbidden","type":"about:blank","code":"FORBIDDEN"}'}
        '200':
          description: '200'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/api-v1-admin-recommended-books908039350'}
              examples:
                admin-recommended-books: {value: '{"books":[{"bookId":42,"isbn13":"9788925568683","title":"마션","coverImageUrl":"https://example.com/martian.jpg","authors":["앤디
                    위어"],"createdAt":"2026-08-28T00:00:00Z"}]}'}
      security: *id001
    post:
      tags: [관리자]
      summary: 추천 도서 추가
      description: 관리자가 ISBN-13으로 도서를 조회해 추천 도서로 등록한다. 추천 도서는 최대 10권까지 등록할 수 있다
      operationId: admin-recommended-book-add
      requestBody:
        content:
          application/json;charset=UTF-8:
            schema: {$ref: '#/components/schemas/api-v1-admin-recommended-books-1231260270'}
            examples:
              admin-recommended-book-add-invalid-request: {value: '{"isbn13":"9788925568680"}'}
              admin-recommended-book-add: {value: '{"isbn13":"9788925568683"}'}
              admin-recommended-book-add-limit-exceeded: {value: '{"isbn13":"9788925568683"}'}
      responses:
        '400':
          description: '400'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples:
                admin-recommended-book-add-invalid-request: {value: '{"detail":"요청값이
                    올바르지 않습니다.","instance":"/api/v1/admin/recommended-books","status":400,"title":"Bad
                    Request","type":"about:blank","code":"INVALID_REQUEST"}'}
        '201':
          description: '201'
          headers:
            Location:
              description: 등록된 추천 도서 URI
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/api-v1-admin-recommended-books-916433424'}
              examples:
                admin-recommended-book-add: {value: '{"bookId":42,"isbn13":"9788925568683","title":"마션","coverImageUrl":"https://example.com/martian.jpg","authors":["앤디
                    위어"],"createdAt":"2026-08-28T00:00:00Z"}'}
        '409':
          description: '409'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples:
                admin-recommended-book-add-limit-exceeded: {value: '{"detail":"추천
                    도서는 최대 10권까지 등록할 수 있습니다.","instance":"/api/v1/admin/recommended-books","status":409,"title":"Conflict","type":"about:blank","code":"RECOMMENDED_BOOK_LIMIT_EXCEEDED"}'}
      security: *id001
  /api/v1/auth/guest-token:
    post:
      tags: [인증]
      summary: 게스트 토큰 발급
      description: 로그인 없이 공개 상호작용에 사용할 90일 유효 게스트 토큰과 닉네임을 발급한다. 저장된 토큰이 없을 때만 호출한다
      operationId: guest-token-issue
      responses:
        '201':
          description: '201'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/api-v1-auth-guest-token-refresh-2120401049'}
              examples:
                guest-token-issue: {value: '{"guestToken":"guest-token","nickname":"다정한
                    파란 참새","expiresAt":"2026-11-24T09:00:00"}'}
  /api/v1/auth/logout:
    post:
      tags: [인증]
      summary: 웹 로그아웃
      description: refresh_token 쿠키를 폐기하고 access_token·refresh_token 쿠키를 삭제한다
      operationId: web-logout
      responses:
        '204':
          description: '204'
          headers:
            Set-Cookie:
              description: 갱신되거나 삭제된 access_token·refresh_token 쿠키
              schema: {type: string}
  /api/v1/auth/reissue:
    post:
      tags: [인증]
      summary: 웹 토큰 재발급
      description: refresh_token 쿠키를 사용해 새 access_token과 refresh_token 쿠키를 발급한다
      operationId: web-token-reissue
      responses:
        '204':
          description: '204'
          headers:
            Set-Cookie:
              description: 갱신되거나 삭제된 access_token·refresh_token 쿠키
              schema: {type: string}
  /api/v1/home/latest-reviews:
    get:
      tags: [홈]
      summary: 최신 감상 목록 조회
      description: 삭제되지 않고 스포일러가 아닌 최신 감상을 최대 10개 조회한다. 조회할 감상이 없으면 빈 배열을 반환한다
      operationId: home-latest-reviews
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/api-v1-home-latest-reviews49969295'}
              examples:
                home-latest-reviews: {value: '{"reviews":[{"content":"도시는 기억으로 만들어진다는
                    문장에서 오래 멈췄다.","createdAt":"2026-08-18T14:00:00Z","author":{"memberId":1,"displayName":"다정한
                    참새","profileImageUrl":"https://example.com/profile.jpg","anonymous":false,"mine":false,"actorType":"MEMBER","profileStatus":"AVAILABLE"},"replyCount":12,"bookId":42,"isbn13":"9788936433598","bookTitle":"보이지
                    않는 도시","bookCoverImageUrl":"https://example.com/invisible-cities.jpg"}]}'}
  /api/v1/home/popular-books:
    get:
      tags: [홈]
      summary: 인기 책 목록 조회
      description: 유효 감상과 답글 수의 합이 많은 책을 최대 10권 조회한다. 조회할 책이 없으면 빈 배열을 반환한다
      operationId: home-popular-books
      responses:
        '200':
