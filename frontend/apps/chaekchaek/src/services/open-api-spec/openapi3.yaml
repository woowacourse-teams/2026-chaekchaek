        in: path
        description: 공개 서재를 조회할 회원 ID
        required: true
        schema: {type: integer, format: int32}
      - name: page
        in: query
        description: 1부터 시작하는 페이지 번호
        required: true
        schema: {type: integer, format: int32}
      - name: status
        in: query
        description: 필터할 읽기 상태. 생략하면 전체 상태를 조회한다
        required: false
        schema: {type: string}
      - name: sort
