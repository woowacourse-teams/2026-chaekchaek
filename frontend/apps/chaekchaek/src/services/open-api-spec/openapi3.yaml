        "description": "내 책장의 맨 뒤에 도서를 추가한다.\n\n- `isbn13`은 필수이며 `totalPages`는 선택 도서 정보다. `status`와 `currentPage`는 받지 않는다.\n- 같은 책장에 이미 있으면 `LIBRARY_ITEM_ALREADY_EXISTS`다. 다른 책장에 담긴 도서는 추가할 수 있다.\n- 책장에 이미 30권 이상 있으면 `409`다. 오류 코드 `LIBRARY_ITEM_LIMIT_EXCEEDED`는 이름 제안이며 최종 이름은 미정이다.\n- 29권에서 한 권을 추가하면 30권이 된다. 이전 데이터가 30권을 넘으면 30권 미만으로 줄인 뒤 추가할 수 있다.\n- 전달한 `totalPages`가 저장된 도서 정보와 다르면 `TOTAL_PAGES_CONFLICT`다.\n- 성공하면 `201`과 추가한 도서 정보, `Location` 헤더를 반환한다.",
