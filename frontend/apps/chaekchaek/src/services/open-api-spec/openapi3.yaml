        "description": "회원의 서재를 책장별 도서 목록과 함께 조회한다.\n\n- `memberId`에 해당하는 모든 책장과 각 책장에 담긴 전체 도서를 반환한다.\n- 책장과 `items`는 저장된 표시 순서다. `totalCount`는 해당 책장의 전체 도서 수다.\n- 기본 책장은 첫 공개 닉네임 설정 시 생성한다. 기본 책장과 일반 책장이 모두 없으면 `libraries: []`다.\n- 같은 책이 서로 다른 책장에 포함될 수 있다. 이전된 기본 책장은 30권을 넘을 수 있으며 전체 도서를 반환한다.\n- 인증 없이 조회할 수 있다. 없는 회원이나 비활성 회원의 오류는 현재 초안에서 `MEMBER_NOT_FOUND`이며 기존 코드와의 정합성은 미정 계약에 기록했다.",
