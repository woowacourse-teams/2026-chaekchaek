{
  "openapi": "3.0.3",
  "info": {
    "title": "ChaekChaek API 변경 계약",
    "version": "draft-2026-10-22-r3",
    "description": "서재와 책장 분리, 독서 기능 제거를 반영한 구현 예정 계약 r3다.\n\n- 서재와 책장 조회는 공개다. 변경 요청은 기존 회원 쿠키 또는 Bearer 인증을 사용한다. 감상과 답글은 기존 게스트 인증도 지원한다.\n\n**확정한 제품 정책**\n\n- 독서 상태, 현재 페이지와 감상 위치 페이지를 제거한다. 목록 페이지네이션과 도서 정보의 `totalPages`는 유지한다.\n- 감상 작성과 별점 등록의 기존 서재 자동 추가를 제거한다. 어느 책장에도 없는 도서에 감상과 별점을 남길 수 있으며 책장 배치는 바뀌지 않는다.\n- 별점은 회원과 도서 기준으로 한 번만 저장하고 집계한다. 모든 책장에서 도서를 삭제해도 별점은 유지한다. `myRating`으로 책장 등록 여부를 판단하지 않는다.\n- 기본 책장은 가입 시 만들지 않고 첫 공개 닉네임 설정 시 만든다. 이름은 `{닉네임}의 서재`이며 이후 닉네임을 바꿔도 이름은 유지한다.\n- 기본 책장 이름이 100자를 넘으면 접미사를 유지하고 닉네임 부분을 코드포인트 단위로 줄여 `String.length()` 기준 100 이하로 맞춘다. 같은 회원의 동일 이름 책장이 있으면 그 책장을 기본 책장으로 지정한다. 이름 비교는 운영 DB의 유일 제약 비교 규칙을 따른다.\n- 기본 책장은 삭제할 수 없다. 일반 책장 삭제 시 그 책장에 담긴 항목을 함께 삭제한다. 다른 책장의 배치와 내 별점은 유지한다.\n- 기본 책장과 일반 책장이 모두 없는 회원의 서재는 `libraries: []`다. 닉네임 미설정만으로 빈 배열이나 회원 없음 오류를 강제하지 않는다.\n- 같은 도서는 여러 책장에 담을 수 있다. 같은 책장 안의 중복만 금지한다. 책장과 도서의 배열은 저장된 표시 순서다.\n- 책장당 신규 도서 추가 한도는 30권이다. 이미 30권 이상이면 추가가 실패한다. 이전된 30권 초과 책장은 모든 도서의 조회, 삭제와 전체 순서 변경이 가능하다.\n- 공개 닉네임이 있는 기존 회원은 배포 때 기본 책장을 만들거나 동일 이름 책장을 재사용하고 기존 도서를 옮긴다. 기존 데이터는 30권을 넘더라도 유지한다.\n- 기존 API 호환 기간 없이 서버와 클라이언트를 함께 전환한다. 같은 배포에서 기존 URI와 독서 상태, 현재 페이지, 감상 위치 페이지 데이터를 제거한다.\n- 일괄 삭제와 일괄 상태 변경 기능은 제거한다.\n\n**미정 계약**\n\n- **DB 미등록 도서의 별점 등록 경로**: 상세 조회의 `bookId`가 `null`인 도서에 책장 배치 없이 별점만 남길 최종 경로와 요청, 응답은 미정이다. ISBN 기반 등록은 후보이며 API 목록에 추가하지 않았다.\n- **닉네임 설정 전 일반 책장 생성**: 일반 책장 생성의 허용 여부, 제한 시 실패 상태와 오류 코드, 허용 시 첫 기본 책장의 표시 순서가 미정이다.\n- **닉네임 없는 기존 회원의 도서 이전**: 공개 닉네임 없이 기존 서재에 담은 도서를 전환 배포에서 어떻게 처리할지 미정이다.\n- **30권 추가 제한의 오류 코드 이름**: 추가 실패의 HTTP 상태는 `409`다. `LIBRARY_ITEM_LIMIT_EXCEEDED`는 제안 이름이며 최종 코드는 미정이다.\n- **공개 서재의 회원 없음 오류 코드**: r2의 `MEMBER_NOT_FOUND`를 임시 유지했다. 기존 공개 조회의 `LIBRARY_NOT_FOUND`와 맞출지 확정되지 않았다.\n\n**구현 상태**\n\n- 신규와 변경 API는 구현 예정 계약이다. 실제 서버에 반영됐다는 의미가 아니다.\n- 로컬 REST Docs 생성 명세를 기준으로 했다. 2026-10-22 참조 확인 당시 개발 Swagger는 `502`여서 배포본과의 동일 여부를 확인하지 못했다.\n- 나머지 계약 제안은 감상 기본 정렬 `LATEST`, 순서 충돌 코드 `ORDER_CONFLICT`, 기존 인증 실패 응답과의 정합성이다."
  },
