<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>책등 시안 - 두 번째 방향</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f5f2;color:#25251f;font-family:"Apple SD Gothic Neo",sans-serif}main{max-width:1296px;margin:auto;padding:36px 32px}header{display:flex;justify-content:space-between;align-items:end;margin-bottom:36px}h1{font-size:26px;letter-spacing:-1px;margin:0 0 10px}p{margin:0;color:#73736b;font-size:13px;line-height:1.6}.version{font-size:11px;letter-spacing:2px;color:#888}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}h2{font-size:19px;margin:0 0 7px}.sample{margin-top:22px;background:#fff;overflow:hidden;border:1px solid #e7e5df}.stage{height:355px;display:flex;align-items:flex-end;justify-content:center;padding:34px 24px 35px;gap:2px;position:relative;background:linear-gradient(#fff 85%,#f9f8f5)}.stage:after{content:"";position:absolute;bottom:32px;left:20px;right:20px;height:3px;background:#dedbd3;box-shadow:0 3px 5px #0000000a}.book{width:var(--w);height:var(--h);background:var(--c);color:var(--ink);position:relative;flex-shrink:0;box-shadow:2px 2px 4px #00000012;border-radius:1px 2px 0 0;overflow:hidden}.book:after{content:"";position:absolute;inset:0;pointer-events:none;background:linear-gradient(90deg,#00000010,transparent 3px,transparent calc(100% - 3px),#00000016)}.title{position:absolute;top:25px;left:0;right:0;display:flex;flex-direction:column;align-items:center;line-height:1.18;font-size:13px;letter-spacing:0;z-index:1}.space{height:5px}.author{position:absolute;bottom:18px;left:0;right:0;font-size:8px;letter-spacing:-.4px;text-align:center;white-space:nowrap;z-index:2}.a .book{background:color-mix(in srgb,var(--c) 9%,#fbf8ee);color:var(--dark);border-top:12px solid var(--c);border-bottom:7px solid var(--c)}.a .title{font-family:"Songti SC",Batang,serif;font-size:13px;font-weight:500;top:20px}.a .author{bottom:15px}.a .rule{position:absolute;left:10px;right:10px;bottom:37px;height:1px;background:var(--c);opacity:.65}.b .book{background:var(--c);color:var(--ink)}.b .title{font-weight:800;font-size:15px;top:16px;line-height:1.02;align-items:flex-start;padding-left:8px}.b .space{height:5px}.b .author{font-size:8px;bottom:13px;opacity:.9}.b .rule{position:absolute;bottom:36px;height:3px;left:8px;right:8px;background:currentColor}.c .book{background:var(--c);color:var(--ink)}.c .title{font-family:"Songti SC",Batang,serif;font-size:13px;top:19px;font-weight:600}.c .band{position:absolute;bottom:0;height:57px;left:0;right:0;background:color-mix(in srgb,var(--c) 15%,#fffaf0);border-top:1px solid #fff5}.c .author{color:var(--dark);bottom:25px}.c .rule{position:absolute;bottom:12px;left:13px;right:13px;height:1px;background:var(--dark);z-index:1;opacity:.5}.detail{padding:18px 22px 22px;border-top:1px solid #eceae4}.detail strong{font-size:12px;font-weight:500}.detail p{font-size:12px;margin-top:6px}.small{margin-top:20px}.small-label{display:flex;justify-content:space-between;color:#77776e;font-size:11px;margin-bottom:12px}.small-stage{height:206px;position:relative;background:white;border-bottom:3px solid #dedbd3;overflow:hidden}.mini{position:absolute;left:24px;bottom:0;display:flex;gap:2px;align-items:flex-end;transform:scale(.72);transform-origin:left bottom}.source{margin-top:34px;padding-top:24px;border-top:1px solid #dedcd4}.source h3{font-size:13px;margin:0 0 18px}.covers{display:flex;gap:30px;flex-wrap:wrap}.cover{display:flex;gap:12px;align-items:center;font-size:11px}.cover img{width:48px;height:70px;object-fit:contain}.cover span{display:block;margin-top:7px;color:#888}.dot{width:9px;height:9px;display:inline-block;border-radius:50%;margin-right:5px}button{padding:8px 13px;background:transparent;border:1px solid #d7d5cd;border-radius:5px;cursor:pointer;color:#555;font-size:11px}.compact .small-stage{width:320px;max-width:100%}.compact .small-label:after{content:"320px"}.normal .small-label:after{content:"390px"}@media(max-width:850px){.grid{grid-template-columns:1fr}.option{max-width:390px;width:100%;margin:auto}main{padding:24px 16px}header{display:block}.version{display:block;margin-top:15px}}
.a .title{font-size:12px}.c .title{font-size:12px;line-height:1.1}.c .space{height:4px}
</style><body class="normal"><main><header><div><h1>책처럼 보이는 책등</h1><p>표지의 대표색은 유지하고, 종이와 글자와 띠지의 관계를 달리한 세 안이랍니다.</p></div><span class="version">SECOND STUDY / 03 OPTIONS</span></header><div class="grid"></div><section class="source"><h3>사용한 표지와 추출색</h3><div class="covers"></div></section></main>
<script>
const books=[
{title:"새들이 전하는 짧은 철학",author:"뒤부아",file:"birds",c:"#572943",ink:"#fff",dark:"#572943",w:42,h:242},
{title:"사랑의 편린들",author:"김희영",file:"love",c:"#8facb7",ink:"#182f36",dark:"#344b53",w:36,h:263},
{title:"객체지향의 사실과 오해",author:"조영호",file:"objects",c:"#f0ecaf",ink:"#343417",dark:"#55542c",w:46,h:252},
{title:"채식주의자",author:"한강",file:"vegetarian",c:"#5276b4",ink:"#fff",dark:"#304974",w:34,h:232}
];
const options=[["a","01  종이 커버","얇은 색 테두리 + 미색 종이 + 명조 제목","표지색을 위아래 단면과 글자에 남겨, 차분한 문고본처럼 보이게 했답니다."],["b","02  굵은 타이포","표지색 전면 + 굵은 제목 + 비대칭 정렬","제목 크기와 무게를 키워 작은 책장에서도 이름이 먼저 읽히게 했답니다."],["c","03  투톤 띠지","표지색 몸통 + 밝은 하단 띠지","책 하단에 띠지를 둘러 색 덩어리를 나누고 실제 제본의 인상을 더했답니다."]];
function spine(b){return '<div class="book" style="--c:'+b.c+';--ink:'+b.ink+';--dark:'+b.dark+';--w:'+b.w+'px;--h:'+b.h+'px"><div class="title">'+Array.from(b.title).map(ch=>'<span class="'+(ch===" "?"space":"")+'">'+ch+'</span>').join("")+'</div><div class="band"></div><div class="rule"></div><div class="author">'+b.author+'</div></div>'}
document.querySelector(".grid").innerHTML=options.map(([id,title,sub,note])=>'<section class="option '+id+'"><h2>'+title+'</h2><p>'+sub+'</p><div class="sample"><div class="stage">'+books.map(spine).join("")+'</div><div class="detail"><strong>'+sub+'</strong><p>'+note+'</p></div></div><div class="small"><div class="small-label">앱 책장 크기</div><div class="small-stage"><div class="mini">'+books.map(spine).join("")+'</div></div></div></section>').join("");
document.querySelector(".covers").innerHTML=books.map(b=>'<div class="cover"><img src="assets/'+b.file+'.jpg" alt="'+b.title+'"><div>'+b.title+'<span><i class="dot" style="background:'+b.c+'"></i>'+b.c.toUpperCase()+'</span></div></div>').join("");
window.designReady=true;
</script></body></html>
