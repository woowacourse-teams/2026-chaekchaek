<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>책등 대체 디자인 3안</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f4f1;color:#20201e;font-family:"Apple SD Gothic Neo","Noto Sans KR",sans-serif}main{max-width:1280px;margin:0 auto;padding:40px 24px}h1{font-size:26px;margin:0 0 12px;letter-spacing:-1px}p{line-height:1.6;color:#686862;margin:0}header{margin-bottom:30px}.controls{display:flex;gap:8px;margin:22px 0}button{border:1px solid #d2d2cc;background:white;padding:10px 18px;border-radius:24px;cursor:pointer}button.active{background:#20201e;color:white;border-color:#20201e}.options{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap}.option{width:390px;max-width:100%}.caption{margin-bottom:16px}.caption h2{font-size:18px;margin:0 0 5px}.caption p{font-size:13px}.phone{width:100%;background:white;border:1px solid #e4e3df;border-radius:20px;overflow:hidden}.appbar{height:72px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;font-size:20px;font-weight:650}.profile{border:1px solid #222;border-radius:50%;width:34px;height:34px;display:grid;place-items:center;font-size:18px}.filters{display:flex;gap:5px;white-space:nowrap;padding:12px 24px 0;overflow:hidden;font-size:11px}.filters span{padding:9px 12px;border-radius:24px;background:#f3f3f5}.filters span:first-child{background:#20201e;color:white}.shelf{height:247px;padding:36px 24px 0;display:flex;gap:3px;align-items:flex-end;position:relative}.shelf:after{content:"";position:absolute;bottom:0;left:24px;right:24px;height:4px;background:#e5e3e0}.spine{position:relative;width:42px;flex-shrink:0;background:var(--color);color:var(--ink);height:var(--height);display:flex;justify-content:center;padding:14px 3px 15px;margin-bottom:4px;overflow:hidden}.title{writing-mode:vertical-rl;text-orientation:upright;font-size:12px;line-height:1.1;letter-spacing:.9px;white-space:normal;max-height:100%;font-weight:600}.type-b .spine{padding:15px 7px}.type-b .title{background:#faf8ef;color:#272720;padding:8px 5px;font-size:11px;letter-spacing:.8px;box-shadow:0 0 0 1px #00000009}.type-c .spine{border-radius:2px 1px 0 0;background:linear-gradient(90deg,#0003,transparent 12%,#fff2 22%,transparent 45%,#0002),var(--color);box-shadow:1px 0 2px #0002}.type-c .spine:before,.type-c .spine:after{content:"";position:absolute;left:4px;right:4px;height:1px;background:currentColor;opacity:.3}.type-c .spine:before{top:7px}.type-c .spine:after{bottom:9px}.type-c .title{font-family:"Songti SC","Batang",serif;font-weight:500}.count{display:flex;justify-content:space-between;padding:26px 24px 16px;font-size:11px}.count small{color:#777}.row{display:flex;gap:16px;margin:0 24px;padding:20px 0;border-bottom:1px solid #e9e9e7;align-items:center}.row img{width:53px;height:78px;object-fit:contain;box-shadow:0 4px 7px #0002}.book-info{flex:1;min-width:0}.book-info em{font-style:normal;font-size:10px;color:#888}.book-info strong{display:block;font-size:14px;margin:7px 0}.book-info small{font-size:10px;color:#888}.progress{height:3px;background:#eee;margin-top:15px}.progress:before{content:"";display:block;background:#ff8b00;width:32%;height:3px}nav{display:flex;justify-content:space-around;padding:22px 8px;color:#999;font-size:11px}nav b{color:#222}.sources{margin-top:36px;border-top:1px solid #dcdcd5;padding-top:24px}.sources h2{font-size:16px}.covers{display:flex;gap:28px;flex-wrap:wrap}.cover{display:flex;gap:12px;align-items:center;font-size:12px}.cover img{height:90px;width:62px;object-fit:contain}.swatch{display:inline-block;width:12px;height:12px;vertical-align:middle;border-radius:50%;margin-right:5px}.source-title{max-width:160px;margin-bottom:7px}.note{font-size:12px;margin-top:20px}body.compact .option{width:320px}body.compact .shelf{gap:3px}body.compact .spine{width:39px}
@media(max-width:700px){main{padding:24px 16px}.options{justify-content:center}.option{margin-bottom:18px}h1{font-size:22px}.covers{gap:20px}.cover{width:100%}}
.title{writing-mode:horizontal-tb;display:flex;flex-direction:column;align-items:center;white-space:nowrap;max-height:none;font-size:11px;line-height:1.15;letter-spacing:0}
.title .space{height:4px;flex-shrink:0}
.type-b .title{font-size:10px;letter-spacing:0;padding:7px 5px}
</style>
<main><header><h1>책등 이미지가 없는 책, 세 가지 표현</h1><p>같은 표지에서 추출한 대표색과 같은 제목으로 비교하는 시안이랍니다.</p><div class="controls"><button class="active" data-width="390">390px</button><button data-width="320">320px</button></div></header><div class="options"></div><section class="sources"><h2>표지 → 대표색</h2><div class="covers"></div><p class="note">실제 도서 표지로 색을 추출했으며, 책등이 없는 상황을 가정한 디자인 예시랍니다. 밝은 무채색 영역을 제외한 주요 색군을 사용하고, 글자는 배경 명도에 맞춰 흰색 또는 짙은색으로 조정한답니다.</p></section></main>
<script>
const books=[
{title:"새들이 전하는 짧은 철학",author:"필리프 J. 뒤부아",file:"birds",height:178},
{title:"사랑의 편린들",author:"김희영",file:"love",height:192},
{title:"객체지향의 사실과 오해",author:"조영호",file:"objects",height:184},
{title:"채식주의자",author:"한강",file:"vegetarian",height:170}
];
function colorOf(img){const c=document.createElement("canvas");c.width=c.height=48;const ctx=c.getContext("2d");ctx.drawImage(img,0,0,48,48);const d=ctx.getImageData(0,0,48,48).data;const groups=new Map();for(let i=0;i<d.length;i+=4){const rgb=[d[i],d[i+1],d[i+2]],max=Math.max(...rgb),min=Math.min(...rgb);if(max-min<24||max>244&&min>215||max<28)continue;const key=rgb.map(x=>Math.floor(x/32)).join(",");const g=groups.get(key)||{n:0,sum:[0,0,0]};g.n++;rgb.forEach((v,k)=>g.sum[k]+=v);groups.set(key,g)}const g=[...groups.values()].sort((a,b)=>b.n-a.n)[0];const rgb=g?g.sum.map(x=>Math.round(x/g.n)):[174,169,153];return "#"+rgb.map(x=>x.toString(16).padStart(2,"0")).join("")}
function ink(hex){const rgb=hex.slice(1).match(/../g).map(x=>parseInt(x,16)/255).map(x=>x<=.04045?x/12.92:((x+.055)/1.055)**2.4);const l=rgb[0]*.2126+rgb[1]*.7152+rgb[2]*.0722;return l>.179?"#171713":"#ffffff"}
async function render(){await Promise.all(books.map(b=>new Promise((resolve,reject)=>{const img=new Image;img.onload=()=>{b.color=colorOf(img);b.ink=ink(b.color);resolve()};img.onerror=reject;img.src="assets/"+b.file+".jpg"})));
const options=[["a","01  단색형","대표색을 그대로 펼치고 제목을 또렷하게 세운답니다."],["b","02  제목 띠형","대표색 위에 밝은 종이 띠를 얹어 제목을 구분한답니다."],["c","03  양장형","가장자리 음영과 얇은 선으로 책등의 두께를 표현한답니다."]];
document.querySelector(".options").innerHTML=options.map(([type,title,desc])=>'<section class="option type-'+type+'"><div class="caption"><h2>'+title+'</h2><p>'+desc+'</p></div><div class="phone"><div class="appbar">책췍 <span class="profile">♙</span></div><div class="filters"><span>전체</span><span>읽는 중</span><span>다 읽음</span><span>읽고 싶어요</span></div><div class="shelf">'+books.map(b=>'<div class="spine" style="--color:'+b.color+';--ink:'+b.ink+';--height:'+b.height+'px" title="'+b.title+'"><span class="title">'+b.title+'</span></div>').join("")+'</div><div class="count">전체 4<small>최근 기록순</small></div>'+books.slice(0,2).map(b=>'<div class="row"><img src="assets/'+b.file+'.jpg" alt="'+b.title+' 표지"><div class="book-info"><em>읽는 중</em><strong>'+b.title+'</strong><small>'+b.author+'</small><div class="progress"></div></div></div>').join("")+'<nav><span>홈</span><span>피드</span><span>발견</span><b>내 서재</b></nav></div></section>').join("");
document.querySelector(".covers").innerHTML=books.map(b=>'<div class="cover"><img src="assets/'+b.file+'.jpg" alt="'+b.title+' 원본 표지"><div><div class="source-title">'+b.title+'</div><span class="swatch" style="background:'+b.color+'"></span>'+b.color.toUpperCase()+'</div></div>').join("");window.designReady=true;window.palette=books;}
document.querySelectorAll("button").forEach(btn=>btn.onclick=()=>{document.body.classList.toggle("compact",btn.dataset.width==="320");document.querySelectorAll("button").forEach(x=>x.classList.toggle("active",x===btn))});render();
const watcher=new MutationObserver(()=>{document.querySelectorAll(".title:not([data-stacked])").forEach(e=>{e.dataset.stacked="true";const text=e.textContent;e.replaceChildren(...Array.from(text).map(ch=>{const s=document.createElement("span");s.textContent=ch;s.className=ch===" "?"space":"";return s}))})});watcher.observe(document.querySelector(".options"),{childList:true,subtree:true});
</script></html>
