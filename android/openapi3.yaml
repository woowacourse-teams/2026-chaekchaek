openapi: 3.0.1
info:
  title: ChaekChaek API
  description: |-
    ChaekChaek 웹·모바일 클라이언트를 위한 REST API입니다.

    ## Swagger 이용 안내
    - 운영 Swagger는 API 계약 확인을 위한 읽기 전용 문서입니다.
    - Try it out은 GET 요청만 지원합니다.
    - Swagger UI에서는 쿠키와 Authorization 헤더를 전송하지 않습니다.
    - 인증이 필요한 API의 실행은 개발·QA 환경 또는 별도 API 클라이언트를 사용합니다.

    ## 웹 인증
    - OAuth 로그인 성공 후 `access_token`, `refresh_token` 쿠키를 사용합니다.
    - 보호된 API는 `access_token` 쿠키 또는 `Authorization: Bearer {accessToken}` 헤더로 인증할 수 있습니다.
    - 웹 토큰 재발급과 로그아웃은 `refresh_token` 쿠키를 사용합니다.

    ## 모바일 인증
    - Google SDK에서 받은 ID Token을 모바일 로그인 API에 전달합니다.
    - 응답의 Access Token은 `Authorization: Bearer {accessToken}` 헤더로 전달합니다.
    - `accessTokenExpiresIn`, `refreshTokenExpiresIn`의 단위는 초입니다.
    - 모바일 토큰 재발급 시 기존 Refresh Token은 폐기되고 새 토큰이 발급됩니다.

    ## 게스트 인증
    - `POST /api/v1/auth/guest-token`으로 90일간 유효한 게스트 토큰과 작성자 닉네임을 발급받습니다.
    - 토큰 만료까지 14일 이하로 남으면 `POST /api/v1/auth/guest-token/refresh`에 현재 `X-Guest-Token`을 전달해 같은 Actor의 토큰을 갱신합니다.
    - 갱신 성공 시 새 토큰의 유효기간은 다시 90일이며 기존 토큰은 즉시 무효화됩니다.
    - 감상·답글의 작성, 수정, 삭제와 좋아요 등록, 취소 요청에는 `X-Guest-Token: {guestToken}` 헤더를 사용할 수 있습니다.
    - 서재, 별점, 독서 상태, 쪽수는 회원 전용 기능입니다.
    - 게스트가 최초 소셜 회원가입할 때 같은 게스트 토큰을 전달하면 기존 Actor와 닉네임 및 공개 상호작용이 계승됩니다.
    - 웹 OAuth 로그인 전 `POST /api/v1/auth/oauth2/guest-context`에 `X-Guest-Token`을 전달하면 OAuth 리다이렉트 중에도 게스트 Actor가 로그인 세션에 임시 보관되어 감상·답글 기록이 회원 Actor로 이전됩니다. 좋아요 기록은 이전하지 않으며 기존 좋아요 수와 게스트 좋아요는 유지됩니다. 프론트는 성공 응답 후 기존 Google 로그인 링크로 이동합니다.
    - 게스트 기록 이전은 신규 회원가입뿐 아니라 기존 소셜 계정 로그인에도 적용되며, 모바일 로그인 API의 기존 헤더 기반 흐름은 변경하지 않습니다.
    - 토큰이 유실되거나 만료되면 기존 게스트 콘텐츠를 수정하거나 삭제할 수 없습니다.

    ## 오류 처리
    - 클라이언트의 오류 분기에는 ProblemDetail의 `code`를 사용합니다.
    - `detail`은 사용자 표시 또는 디버깅 참고용이며 분기 기준으로 사용하지 않습니다.
    - `type`은 현재 `about:blank`으로 고정됩니다.
  version: local
servers:
- {url: ..}
tags: []
paths:
  /api/v1/books:
    get:
      tags: [도서]
      summary: 도서 검색
      description: 도서명과 페이지 번호로 도서를 검색하며 외부 검색 결과의 순서를 유지한다
      operationId: book-search
      parameters:
      - name: query
        in: query
        description: 검색할 도서명
        required: true
        schema: {type: string}
      - name: page
        in: query
        description: 1부터 시작하는 페이지 번호
        required: true
        schema: {type: integer, format: int32, minimum: 1}
      responses:
        '500':
          description: '500'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples:
                book-search-internal-server-error: {value: '{"detail":"서버 내부 오류가 발생했습니다.","instance":"/api/v1/books","status":500,"title":"Internal
                    Server Error","type":"about:blank","code":"INTERNAL_SERVER_ERROR"}'}
        '200':
          description: '200'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/api-v1-books-1080543695'}
              examples:
                book-search: {value: '{"totalCount":1,"nextPage":null,"items":[{"bookId":null,"title":"마션","coverImageUrl":"https://example.com/books/cover.jpg","authors":["앤디
                    위어"],"translators":["박아람"],"publishedDate":"2026-07-01","isbn13":"9788925568683","category":"국내도서>소설>과학소설","publisher":"알에이치코리아(RHK)","reviewCount":null,"replyCount":null,"isRegisteredInMyLibrary":null}]}'}
                search-registered-book:
                  summary: 서재에 등록된 도서
                  value:
                    totalCount: 1
                    nextPage: null
                    items:
                    - bookId: 10
                      title: 채식주의자
                      coverImageUrl: https://example.com/book.jpg
                      authors: [한강]
                      translators: []
                      publishedDate: '2007-10-30'
                      isbn13: '9788936433598'
                      category: 국내도서>소설
                      publisher: 창비
                      reviewCount: 1
                      replyCount: 1
                      isRegisteredInMyLibrary: true
                search-unregistered-book:
                  summary: 서재에 등록하지 않은 도서
                  value:
                    totalCount: 1
                    nextPage: null
                    items:
                    - bookId: null
                      title: 마션
                      coverImageUrl: https://example.com/book.jpg
                      authors: [앤디 위어]
                      translators: []
                      publishedDate: '2015-07-10'
                      isbn13: '9788925568683'
                      category: 국내도서>소설
                      publisher: 알에이치코리아
                      reviewCount: null
                      replyCount: null
                      isRegisteredInMyLibrary: false
                search-guest-book:
                  summary: 비로그인 사용자의 도서 검색
                  value:
                    totalCount: 1
                    nextPage: null
                    items:
                    - bookId: null
                      title: 마션
                      coverImageUrl: https://example.com/book.jpg
                      authors: [앤디 위어]
                      translators: []
                      publishedDate: '2015-07-10'
                      isbn13: '9788925568683'
                      category: 국내도서>소설
                      publisher: 알에이치코리아
                      reviewCount: null
                      replyCount: null
                      isRegisteredInMyLibrary: null
        '400':
          description: '400'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples:
                book-search-invalid-request: {value: '{"detail":"요청값이 올바르지 않습니다.","instance":"/api/v1/books","status":400,"title":"Bad
                    Request","type":"about:blank","code":"INVALID_REQUEST"}'}
        '502':
          description: '502'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples:
                book-search-external-api-error: {value: '{"detail":"외부 서비스 호출에 실패했습니다.","instance":"/api/v1/books","status":502,"title":"Bad
                    Gateway","type":"about:blank","code":"EXTERNAL_API_ERROR"}'}
  /api/v1/libraries:
    get:
      tags: [서재]
      summary: 회원의 전체 책장과 도서 요약 조회
      description: |
        회원의 모든 책장과 각 책장에 담긴 도서 목록을 조회한다. 로그인 없이 이용할 수 있다.
        책장과 도서는 설정한 순서대로 반환한다. 같은 도서가 여러 책장에 있으면 각 책장에 포함한다.
        빈 책장도 반환하며, 책장이 없으면 libraries는 빈 배열이다.
        책장 수나 도서 수로 결과를 제한하지 않는다. 기존 책장 이름도 그대로 반환한다.
        없는 회원이나 비활성 회원을 조회하면 `404`, `MEMBER_NOT_FOUND`를 반환한다.
      operationId: libraries-public-collection
      parameters:
      - name: memberId
        in: query
        description: 조회할 회원 ID
        required: true
        schema: {type: integer, format: int64, minimum: 1}
      responses:
        '200':
          description: '200'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LibraryCollectionResponse'}
              examples:
                libraries-public-collection: {value: '{"memberId":1,"libraries":[{"libraryId":7,"name":"기존의
                    긴 책장 이름 !","isDefault":true,"totalCount":1,"items":[{"bookId":42,"title":"책
                    제목","spineImageUrl":null,"isbn13":"9788925568683"}]}]}'}
        '400':
          description: '400'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples:
                libraries-public-collection-invalid-request: {value: '{"detail":"요청값이
                    올바르지 않습니다.","instance":"/api/v1/libraries","status":400,"title":"Bad
                    Request","type":"about:blank","code":"INVALID_REQUEST"}'}
        '404':
          description: '404'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples:
                libraries-public-collection-not-found: {value: '{"detail":"회원을 찾을
                    수 없습니다.","instance":"/api/v1/libraries","status":404,"title":"Not
                    Found","type":"about:blank","code":"MEMBER_NOT_FOUND"}'}
    post:
      tags: [책장]
      summary: 내 서재에 책장 추가
      description: |
        인증된 회원의 내 서재 맨 뒤에 일반 책장을 추가한다.

        - `name`: 닉네임과 같은 규칙으로 공백뿐이 아닌 1~10자를 허용한다.
        - 같은 회원의 다른 책장과 이름이 중복되면 대소문자를 구분하지 않고 `409`, `LIBRARY_NAME_ALREADY_EXISTS`를 반환한다.
        - 닉네임을 설정하지 않은 회원은 `422`, `NICKNAME_REQUIRED`를 반환한다.
        - `SUSPENDED`, `WITHDRAWN` 회원은 `403`, `FORBIDDEN`을 반환한다.
        - 회원당 책장 수 제한은 없으며 새 책장은 맨 뒤에 추가한다.
        - 성공 응답에는 `isDefault: false`, `totalCount: 0`, `items: []`가 포함된다.
        - 새 이름 규칙은 생성 요청에만 적용하며 기존 책장 이름은 보존한다.

        기존 `POST /api/v1/library`는 기본 책장에 도서를 추가한다.
      operationId: library-create
      requestBody:
        content:
          application/json;charset=UTF-8:
            schema: {$ref: '#/components/schemas/CreateLibraryRequest'}
            examples:
              library-create:
                value: |
                  {"name":"올해읽을책"}
              library-create-unauthorized:
                value: |
                  {"name":"올해읽을책"}
              library-create-nickname-required:
                value: |
                  {"name":"올해읽을책"}
              library-create-invalid-request: {value: '{}'}
              library-create-forbidden:
                value: |
                  {"name":"올해읽을책"}
              library-create-internal-server-error:
                value: |
                  {"name":"올해읽을책"}
              library-create-name-already-exists:
                value: |
                  {"name":"올해읽을책"}
        required: true
      responses:
        '201':
          description: 일반 책장 생성 성공. 새 책장은 기본 책장이 아니며 도서가 없는 상태로 생성한다.
          headers:
            Location:
              description: 생성된 책장 URI
              schema: {type: string}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/LibraryShelf'}
              examples:
                library-create: {value: '{"libraryId":7,"name":"올해읽을책","isDefault":false,"totalCount":0,"items":[]}'}
        '401':
          description: 회원 인증 실패. `UNAUTHORIZED`.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples:
                library-create-unauthorized: {value: '{"detail":"인증이 필요합니다.","instance":"/api/v1/libraries","status":401,"title":"Unauthorized","type":"about:blank","code":"UNAUTHORIZED"}'}
        '422':
          description: 닉네임이 없는 회원의 책장 생성 요청. `NICKNAME_REQUIRED`.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples:
                library-create-nickname-required: {value: '{"detail":"닉네임을 먼저 설정해
                    주세요.","instance":"/api/v1/libraries","status":422,"title":"Unprocessable
                    Content","type":"about:blank","code":"NICKNAME_REQUIRED"}'}
        '400':
          description: 잘못된 요청 본문 또는 이름. `INVALID_REQUEST`.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples:
                library-create-invalid-request: {value: '{"detail":"요청값이 올바르지 않습니다.","instance":"/api/v1/libraries","status":400,"title":"Bad
                    Request","type":"about:blank","code":"INVALID_REQUEST"}'}
        '403':
          description: 인증된 비활성 회원의 쓰기 요청. `FORBIDDEN`.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples:
                library-create-forbidden: {value: '{"detail":"요청한 작업을 수행할 권한이 없습니다.","instance":"/api/v1/libraries","status":403,"title":"Forbidden","type":"about:blank","code":"FORBIDDEN"}'}
        '500':
          description: 예상하지 못한 서버 오류. `INTERNAL_SERVER_ERROR`.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples:
                library-create-internal-server-error: {value: '{"detail":"서버 내부 오류가
                    발생했습니다.","instance":"/api/v1/libraries","status":500,"title":"Internal
                    Server Error","type":"about:blank","code":"INTERNAL_SERVER_ERROR"}'}
        '409':
          description: 같은 회원의 책장 이름 중복. `LIBRARY_NAME_ALREADY_EXISTS`.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples:
                library-create-name-already-exists: {value: '{"detail":"같은 이름의 책장이
                    있습니다. 다른 이름을 입력해 주세요.","instance":"/api/v1/libraries","status":409,"title":"Conflict","type":"about:blank","code":"LIBRARY_NAME_ALREADY_EXISTS"}'}
      security: &id001
      - &id002
        bearerAuth: []
      - &id003
        accessTokenCookie: []
  /api/v1/library:
    get:
      tags: [기존 서재 API]
      summary: 내 서재 조회
      description: |-
        인증된 사용자가 기본 책장에 배치된 도서를 기존 읽기 상태와 정렬 기준으로 조회한다. 기본 책장이 없으면 빈 목록을 반환한다

        `page`는 1부터 시작하고 한 페이지에 최대 10개입니다. 마지막 페이지의 `nextPage`는 `null`이며, 범위를 벗어난 페이지도 200과 빈 `items`로 응답합니다. 같은 정렬 값의 항목은 일관된 순서로 반환됩니다.
      operationId: library-list
      parameters:
      - name: page
        in: query
        description: 1부터 시작하는 페이지 번호
        required: true
        schema: {type: integer, format: int32, minimum: 1}
      - name: status
        in: query
        description: 필터할 읽기 상태. 생략하면 전체 상태를 조회한다
        required: false
        schema:
          type: string
          enum: [WANT_TO_READ, READING, FINISHED]
      - name: sort
        in: query
        description: 정렬 기준. 생략하면 RECENT를 사용한다
        required: false
        schema:
          type: string
          enum: [RECENT, OLDEST, COMMENT, RATING, TITLE]
          default: RECENT
      responses:
        '400':
          description: '400'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples:
                library-list-invalid-request: {value: '{"detail":"요청값이 올바르지 않습니다.","instance":"/api/v1/library","status":400,"title":"Bad
                    Request","type":"about:blank","code":"INVALID_REQUEST"}'}
        '401':
          description: '401'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples:
                library-list-unauthorized: {value: '{"detail":"인증이 필요합니다.","instance":"/api/v1/library","status":401,"title":"Unauthorized","type":"about:blank","code":"UNAUTHORIZED"}'}
        '200':
          description: '200'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/api-v1-library-1843128574'}
              examples:
                library-list: {value: '{"totalCount":3,"filteredCount":2,"nextPage":2,"items":[{"bookId":10,"isbn13":"9788936433598","title":"채식주의자","coverImageUrl":"https://image.yes24.com/goods/118578901/xL","spineImageUrl":"https://image.yes24.com/goods/118578901/side","backImageUrl":"https://image.yes24.com/goods/118578901/back","authors":["한강"],"translators":[],"publisher":"창비","category":"국내도서>소설","publishedDate":"2007-10-30","totalPages":368,"commentCount":2,"status":"READING","currentPage":100,"rating":4.5,"addedAt":"2026-08-14T03:00:00Z","readingUpdatedAt":"2026-08-14T03:30:00Z"}]}'}
      security: *id001
    post:
      tags: [기존 서재 API]
      summary: 내 서재에 도서 추가
      description: 인증된 사용자가 ISBN-13 도서를 기본 책장 맨 뒤에 배치한다. 같은 기본 책장 중복은 `LIBRARY_ITEM_ALREADY_EXISTS`,
        30권 이상이면 `LIBRARY_ITEM_LIMIT_EXCEEDED`, 기본 책장이 없으면 `NICKNAME_REQUIRED`다. 다른
        책장에 이미 있으면 공유 독서 기록을 유지하고 기본 책장에 추가한다
      operationId: library-add
      requestBody:
        content:
          application/json;charset=UTF-8:
            schema: {$ref: '#/components/schemas/api-v1-libraries-libraryId923669369'}
            examples:
              library-add-book-not-found:
                value: |
                  {"isbn13":"9788936433598","status":"READING","totalPages":368}
              library-add-already-exists:
                value: |
                  {"isbn13":"9788936433598","status":"READING","totalPages":368}
              library-add-unauthorized:
                value: |
                  {"isbn13":"9788936433598","status":"READING","totalPages":368}
              library-add-invalid-request:
                value: |
                  {"isbn13":"9788936433598","status":"READING","totalPages":368}
              library-add-limit-exceeded:
                value: |
                  {"isbn13":"9788936433598","status":"READING","totalPages":368}
              library-add-invalid-reading-state:
                value: |
                  {"isbn13":"9788936433598","status":"READING","totalPages":368}
              library-add:
                value: |
                  {"isbn13":"9788936433598","status":"READING","totalPages":368}
              library-add-forbidden:
                value: |
                  {"isbn13":"9788936433598","status":"READING","totalPages":368}
              library-add-nickname-required:
                value: |
                  {"isbn13":"9788936433598","status":"READING","totalPages":368}
              library-add-total-pages-conflict:
                value: |
                  {"isbn13":"9788936433598","status":"READING","totalPages":368}
      responses:
        '404':
          description: '404'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples:
