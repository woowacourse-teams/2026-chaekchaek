              examples:
                library-book-order-conflict: {value: '{"detail":"목록이 변경되었습니다. 다시 조회한
                    뒤 순서를 변경해 주세요.","instance":"/api/v1/libraries/7/books/order","status":409,"title":"Conflict","type":"about:blank","code":"ORDER_CONFLICT"}'}
