              library-update-invalid-request:
                value: |
                  {"currentPage":150,"totalPages":368}
              library-update:
                value: |
                  {"currentPage":150,"totalPages":368}
              library-update-unauthorized:
                value: |
                  {"currentPage":150,"totalPages":368}
      responses:
