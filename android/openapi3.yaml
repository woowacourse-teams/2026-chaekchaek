    patch:
      tags: [책장]
      summary: 책장 이름 변경
      description: |
        인증된 회원이 소유한 책장의 이름을 변경한다. 기본 책장도 변경할 수 있으며 기본 여부, 순서와 도서 배치는 유지한다.

        - `name`: 닉네임과 같은 규칙으로 공백뿐이 아닌 1~10자를 허용한다.
        - 같은 회원의 다른 책장과 이름이 중복되면 대소문자를 구분하지 않고 `409`, `LIBRARY_NAME_ALREADY_EXISTS`를 반환한다.
        - 다른 책장과 중복되지 않으면 현재 이름의 대소문자만 바꾸는 요청도 허용한다.
        - 현재와 같은 이름이면 수정 시각과 변경 이벤트를 갱신하지 않고 성공한다.
        - 기본 책장 이름 변경은 회원 닉네임을 변경하지 않는다.
        - 성공 응답은 본문 없는 `204`다.
      operationId: library-rename
      parameters:
      - name: libraryId
        in: path
        description: 이름을 변경할 책장 ID
        required: true
        schema: {type: integer, format: int32, minimum: 1}
      requestBody:
        content:
          application/json;charset=UTF-8:
            schema: {$ref: '#/components/schemas/api-v1-libraries-libraryId-571918913'}
            examples:
              library-rename-forbidden:
                value: |
                  {"name":"읽을책"}
              library-rename-library-not-found:
                value: |
                  {"name":"읽을책"}
              library-rename-unauthorized:
                value: |
                  {"name":"읽을책"}
              library-rename-internal-server-error:
                value: |
                  {"name":"읽을책"}
              library-rename-name-already-exists:
                value: |
                  {"name":"읽을책"}
              library-rename:
                value: |
                  {"name":"읽을 책"}
              library-rename-invalid-request:
                value: |
                  {"name":"읽을책"}
        required: true
      responses:
        '403':
          description: 인증된 비활성 회원 또는 다른 회원의 책장. `FORBIDDEN`.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples:
                library-rename-forbidden: {value: '{"detail":"요청한 작업을 수행할 권한이 없습니다.","instance":"/api/v1/libraries/7","status":403,"title":"Forbidden","type":"about:blank","code":"FORBIDDEN"}'}
        '404':
          description: 책장이 존재하지 않는다. `LIBRARY_NOT_FOUND`.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples:
                library-rename-library-not-found: {value: '{"detail":"책장을 찾을 수 없습니다.","instance":"/api/v1/libraries/7","status":404,"title":"Not
                    Found","type":"about:blank","code":"LIBRARY_NOT_FOUND"}'}
        '401':
          description: 회원 인증 실패. `UNAUTHORIZED`.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples:
                library-rename-unauthorized: {value: '{"detail":"인증이 필요합니다.","instance":"/api/v1/libraries/7","status":401,"title":"Unauthorized","type":"about:blank","code":"UNAUTHORIZED"}'}
        '500':
          description: 예상하지 못한 서버 오류. `INTERNAL_SERVER_ERROR`.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples:
                library-rename-internal-server-error: {value: '{"detail":"서버 내부 오류가
                    발생했습니다.","instance":"/api/v1/libraries/7","status":500,"title":"Internal
                    Server Error","type":"about:blank","code":"INTERNAL_SERVER_ERROR"}'}
        '409':
          description: 같은 회원의 다른 책장과 이름이 중복된다. `LIBRARY_NAME_ALREADY_EXISTS`.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples:
                library-rename-name-already-exists: {value: '{"detail":"같은 이름의 책장이
                    있습니다. 다른 이름을 입력해 주세요.","instance":"/api/v1/libraries/7","status":409,"title":"Conflict","type":"about:blank","code":"LIBRARY_NAME_ALREADY_EXISTS"}'}
        '204': {description: 책장 이름 변경 성공. 응답 본문이 없다.}
        '400':
          description: 잘못된 책장 ID 또는 이름. `INVALID_REQUEST`.
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples:
                library-rename-invalid-request: {value: '{"detail":"요청값이 올바르지 않습니다.","instance":"/api/v1/libraries/0","status":400,"title":"Bad
                    Request","type":"about:blank","code":"INVALID_REQUEST"}'}
      security: *id001
