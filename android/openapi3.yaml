  /api/v1/members/{memberId}/library:
    get:
      tags: [기존 서재 API]
      summary: 사용자 공개 서재 조회
      description: |
        비로그인 사용자를 포함한 모든 사용자가 활성 회원의 기본 책장에 배치된 도서를 조회한다. 기본 책장이 없으면 빈 목록을 반환한다.
        `page`는 1부터 시작하며 한 페이지에 최대 10개를 반환한다. 마지막 페이지의 `nextPage`는 `null`이다.
        필터 결과나 서재가 비어 있으면 200 응답과 빈 `items`를 반환한다.
        존재하지 않거나 탈퇴·정지된 회원의 서재는 `LIBRARY_NOT_FOUND`를 반환한다.
      operationId: public-library-list
      parameters:
      - name: memberId
        in: path
        description: 공개 서재를 조회할 회원 ID
        required: true
        schema: {type: integer, format: int32}
      - name: page
        in: query
        description: 1부터 시작하는 페이지 번호
        required: true
        schema: {type: integer, format: int32}
      - name: status
        in: query
        description: 필터할 읽기 상태. 생략하면 전체 상태를 조회한다
        required: false
        schema: {type: string}
      - name: sort
        in: query
        description: 정렬 기준. 생략하면 RECENT를 사용한다
        required: false
        schema: {type: string}
      responses:
        '404':
          description: '404'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples:
                public-library-list-not-found: {value: '{"detail":"책장을 찾을 수 없습니다.","instance":"/api/v1/members/1/library","status":404,"title":"Not
                    Found","type":"about:blank","code":"LIBRARY_NOT_FOUND"}'}
        '200':
          description: '200'
          content:
            application/json:
              schema: {$ref: '#/components/schemas/api-v1-members-memberId-library-1962601129'}
              examples:
                public-library-list: {value: '{"member":{"memberId":1,"displayName":"책책이","profileImageUrl":"https://example.com/profile.jpg"},"totalCount":1,"filteredCount":1,"nextPage":null,"items":[{"bookId":10,"isbn13":"9788936433598","title":"채식주의자","coverImageUrl":"https://image.yes24.com/goods/118578901/xL","spineImageUrl":"https://image.yes24.com/goods/118578901/side","backImageUrl":"https://image.yes24.com/goods/118578901/back","authors":["한강"],"translators":[],"publisher":"창비","category":"국내도서>소설","publishedDate":"2007-10-30","totalPages":368,"commentCount":2,"status":"READING","currentPage":100,"rating":4.5}]}'}
