        `page`는 1부터 시작하고 한 페이지에 최대 10개입니다. `POPULAR`는 좋아요 수와 답글 수를 합산한 인기순이며, 같은 정렬 값의 항목은 일관된 순서로 반환됩니다. 마지막 페이지의 `nextPage`는 `null`이고 범위를 벗어난 페이지는 200과 빈 `items`입니다.
