  /api/v1/libraries/order:
    patch:
      tags: [책장]
      summary: 서재 내 책장 순서 변경
      description: |
        인증 회원의 모든 책장 ID를 기본 책장까지 포함해 원하는 순서대로 전달한다. 목록이 비어 있으면 빈 배열을 전달한다.
        ID를 중복해서 보내거나 잘못된 형식으로 보내면 `400`, `INVALID_REQUEST`를 반환한다.
        현재 목록의 ID가 빠지거나 다른 ID가 포함되면 `409`, `ORDER_CONFLICT`를 반환한다. 목록을 다시 조회한 뒤 요청한다.
        실패하면 기존 순서를 유지한다. 같은 목록을 동시에 변경하면 마지막으로 저장한 순서를 따른다.
        다른 책장, 독서 기록과 별점은 변경하지 않는다.
      operationId: library-order
      requestBody:
        content:
          application/json;charset=UTF-8:
            schema: {$ref: '#/components/schemas/api-v1-libraries-order262032579'}
            examples:
              library-order-forbidden: {value: '{"libraryIds":[20,10]}'}
              library-order: {value: '{"libraryIds":[2,1]}'}
              library-order-invalid: {value: '{}'}
              library-order-conflict: {value: '{"libraryIds":[20,10]}'}
              library-order-unauthorized: {value: '{"libraryIds":[20,10]}'}
              library-order-empty: {value: '{"libraryIds":[]}'}
        required: true
      responses:
        '403':
          description: '403'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples:
                library-order-forbidden: {value: '{"detail":"요청한 작업을 수행할 권한이 없습니다.","instance":"/api/v1/libraries/order","status":403,"title":"Forbidden","type":"about:blank","code":"FORBIDDEN"}'}
        '204': {description: '204'}
        '400':
          description: '400'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples:
                library-order-invalid: {value: '{"detail":"요청값이 올바르지 않습니다.","instance":"/api/v1/libraries/order","status":400,"title":"Bad
                    Request","type":"about:blank","code":"INVALID_REQUEST"}'}
        '409':
          description: '409'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples:
                library-order-conflict: {value: '{"detail":"목록이 변경되었습니다. 다시 조회한 뒤
                    순서를 변경해 주세요.","instance":"/api/v1/libraries/order","status":409,"title":"Conflict","type":"about:blank","code":"ORDER_CONFLICT"}'}
        '401':
          description: '401'
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/ProblemDetail'}
              examples:
                library-order-unauthorized: {value: '{"detail":"인증이 필요합니다.","instance":"/api/v1/libraries/order","status":401,"title":"Unauthorized","type":"about:blank","code":"UNAUTHORIZED"}'}
