spring:
  application:
    name: incident-analyzer
  datasource:
    url: ${INCIDENT_DB_URL:jdbc:h2:file:./data/incidents;DB_CLOSE_ON_EXIT=FALSE}
    username: sa
    password: ${INCIDENT_DB_PASSWORD:}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  sql:
    init:
      mode: always
server:
  port: 8080
  error:
    include-message: never
management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  metrics:
    tags:
      application: incident-analyzer
incident:
  webhook-token: ${GRAFANA_WEBHOOK_TOKEN:}
  org-id: 1
  enabled-environments: ${ANALYSIS_ENVIRONMENTS:}
  loki-url: ${LOKI_URL:http://localhost:3100}
  prometheus-url: ${PROMETHEUS_URL:http://localhost:9090}
  grafana-url: ${GRAFANA_URL:http://localhost:3000}
  llm-url: ${LLM_URL:https://api.openai.com/v1/responses}
  llm-api-key: ${LLM_API_KEY:}
  llm-model: ${LLM_MODEL:}
  llm-enabled: ${LLM_ENABLED:false}
  daily-call-limit: ${LLM_DAILY_CALL_LIMIT:20}
  slack:
    enabled: ${SLACK_BOT_ENABLED:false}
    app-token: ${SLACK_APP_TOKEN:}
    bot-token: ${SLACK_BOT_TOKEN:}
    channel-dev: ${SLACK_CHANNEL_DEV:}
    channel-prod: ${SLACK_CHANNEL_PROD:}
    alert-bot-id-dev: ${SLACK_ALERT_BOT_ID_DEV:}
    alert-bot-id-prod: ${SLACK_ALERT_BOT_ID_PROD:}
    api-url: ${SLACK_API_URL:https://slack.com/api/}
