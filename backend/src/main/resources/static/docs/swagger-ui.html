<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChaekChaek API</title>
    <link rel="stylesheet" href="../webjars/swagger-ui/5.32.11/swagger-ui.css">
</head>
<body>
<div id="swagger-ui"></div>
<script src="../webjars/swagger-ui/5.32.11/swagger-ui-bundle.js"></script>
<script src="../webjars/swagger-ui/5.32.11/swagger-ui-standalone-preset.js"></script>
<script>
    window.onload = () => {
        window.ui = SwaggerUIBundle({
            url: './openapi3.yaml',
            dom_id: '#swagger-ui',
            deepLinking: true,
            presets: [SwaggerUIBundle.presets.apis, SwaggerUIStandalonePreset],
            layout: 'StandaloneLayout',
            supportedSubmitMethods: ['get'],
            queryConfigEnabled: false,
            withCredentials: false,
            requestInterceptor: request => {
                request.credentials = 'omit';
                return request;
            },
            validatorUrl: null
        });
    };
</script>
</body>
</html>
