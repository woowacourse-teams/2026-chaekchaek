spring:
  application:
    name: chaekchaek
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update

aladin:
  base-url: https://www.aladin.co.kr
  ttb-key: ${ALADIN_TTB_KEY}

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email

app:
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
    oauth-success-path: /oauth/callback
    oauth-failure-path: /login

