server:
  forward-headers-strategy: framework

spring:
  application:
    name: chaekchaek
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            scope:
              - openid
              - profile
              - email

aladin:
  base-url: https://www.aladin.co.kr
  ttb-key: ${ALADIN_TTB_KEY}

app:
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:3000}
    allowed-origins: ${FRONTEND_ALLOWED_ORIGINS:http://localhost:3000}
    oauth-success-path: /oauth/callback
    oauth-failure-path: /login

  auth:
    access-token:
      issuer: chaekchaek
      secret: ${JWT_SECRET}
      expiration: 5m

    refresh-token:
      expiration: 14d

    cookie:
      secure: ${AUTH_COOKIE_SECURE:false}
      same-site: ${AUTH_COOKIE_SAME_SITE:Lax}

    google-id-token:
      issuer: https://accounts.google.com
      jwk-set-uri: https://www.googleapis.com/oauth2/v3/certs
      audience: ${GOOGLE_CLIENT_ID}
