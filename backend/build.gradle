import groovy.json.JsonSlurper
import org.yaml.snakeyaml.Yaml

plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'org.asciidoctor.jvm.convert' version '4.0.5'
	id 'com.epages.restdocs-api-spec' version '0.20.1'
}

group = 'com.chaekchaek'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

ext {
	set('snippetsDir', file("build/generated-snippets"))
}

def openApiSpecFile = layout.buildDirectory.file('api-spec/openapi3.yaml')
def swaggerRuntimeDir = layout.buildDirectory.dir('generated-resources/swagger')
def swaggerStaticDocsDir = swaggerRuntimeDir.map { it.dir('static/docs') }
def stagedOpenApiSpecFile = swaggerStaticDocsDir.map { it.file('openapi3.yaml') }
def apiDocsVersion = providers.gradleProperty('apiDocsVersion')
		.orElse(providers.environmentVariable('API_DOCS_VERSION'))
		.orElse('local')

dependencies {
	// Application
	implementation 'org.springframework.boot:spring-boot-h2console'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-restclient'
	implementation 'com.nimbusds:nimbus-jose-jwt:10.5'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-client'
    implementation 'org.springframework.boot:spring-boot-starter-oauth2-resource-server'
	runtimeOnly 'com.h2database:h2'
	runtimeOnly 'com.mysql:mysql-connector-j'
	runtimeOnly 'org.webjars:swagger-ui:5.32.11'

	// Code generation
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// Test
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-restdocs'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
	testImplementation 'com.epages:restdocs-api-spec-mockmvc:0.20.1'
	testImplementation 'com.squareup.okhttp3:mockwebserver:4.12.0'
    testImplementation 'org.springframework.security:spring-security-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	// Test code generation
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

openapi3 {
	server = '..'
	title = 'ChaekChaek API'
	description = '''ChaekChaek 웹·모바일 클라이언트를 위한 REST API입니다.

## Swagger 이용 안내
- 운영 Swagger는 API 계약 확인을 위한 읽기 전용 문서입니다.
- Try it out은 GET 요청만 지원합니다.
- Swagger UI에서는 쿠키와 Authorization 헤더를 전송하지 않습니다.
- 인증이 필요한 API의 실행은 개발·QA 환경 또는 별도 API 클라이언트를 사용합니다.

## 웹 인증
- OAuth 로그인 성공 후 `access_token`, `refresh_token` 쿠키를 사용합니다.
- 보호된 API는 `access_token` 쿠키 또는 `Authorization: Bearer {accessToken}` 헤더로 인증할 수 있습니다.
- 웹 토큰 재발급과 로그아웃은 `refresh_token` 쿠키를 사용합니다.

## 모바일 인증
- Google SDK에서 받은 ID Token을 모바일 로그인 API에 전달합니다.
- 응답의 Access Token은 `Authorization: Bearer {accessToken}` 헤더로 전달합니다.
- `accessTokenExpiresIn`, `refreshTokenExpiresIn`의 단위는 초입니다.
- 모바일 토큰 재발급 시 기존 Refresh Token은 폐기되고 새 토큰이 발급됩니다.

## 게스트 인증
- `POST /api/v1/auth/guest-token`으로 90일간 유효한 게스트 토큰과 작성자 닉네임을 발급받습니다.
- 토큰 만료까지 14일 이하로 남으면 `POST /api/v1/auth/guest-token/refresh`에 현재 `X-Guest-Token`을 전달해 같은 Actor의 토큰을 갱신합니다.
- 갱신 성공 시 새 토큰의 유효기간은 다시 90일이며 기존 토큰은 즉시 무효화됩니다.
- 감상·답글의 작성, 수정, 삭제와 좋아요 등록, 취소 요청에는 `X-Guest-Token: {guestToken}` 헤더를 사용할 수 있습니다.
- 서재, 별점, 독서 상태, 쪽수는 회원 전용 기능입니다.
- 게스트가 최초 소셜 회원가입할 때 같은 게스트 토큰을 전달하면 기존 Actor와 닉네임 및 공개 상호작용이 계승됩니다.
- 웹 OAuth 로그인 전 `POST /api/v1/auth/oauth2/guest-context`에 `X-Guest-Token`을 전달하면 OAuth 리다이렉트 중에도 게스트 Actor가 로그인 세션에 임시 보관되어 감상·답글 기록이 회원 Actor로 이전됩니다. 좋아요 기록은 이전하지 않으며 기존 좋아요 수와 게스트 좋아요는 유지됩니다. 프론트는 성공 응답 후 기존 Google 로그인 링크로 이동합니다.
- 게스트 기록 이전은 신규 회원가입뿐 아니라 기존 소셜 계정 로그인에도 적용되며, 모바일 로그인 API의 기존 헤더 기반 흐름은 변경하지 않습니다.
- 토큰이 유실되거나 만료되면 기존 게스트 콘텐츠를 수정하거나 삭제할 수 없습니다.

## 오류 처리
- 클라이언트의 오류 분기에는 ProblemDetail의 `code`를 사용합니다.
- `detail`은 사용자 표시 또는 디버깅 참고용이며 분기 기준으로 사용하지 않습니다.
- `type`은 현재 `about:blank`으로 고정됩니다.'''
	version = apiDocsVersion.get()
	format = 'yaml'
	snippetsDirectory = snippetsDir.path
	outputDirectory = layout.buildDirectory.dir('api-spec').get().asFile.path
	outputFileNamePrefix = 'openapi3'
}

tasks.named('test') {
	outputs.dir snippetsDir
	useJUnitPlatform()
	doFirst {
		project.delete(snippetsDir)
	}
}

tasks.matching { it.name == 'openapi3' }.configureEach {
	inputs.dir snippetsDir
	outputs.file openApiSpecFile
	doNotTrackState('ePages exposes non-serializable Swagger model inputs on Gradle 9')
	doLast {
		def sourceFile = openApiSpecFile.get().asFile
		def specification = new Yaml().load(sourceFile.getText('UTF-8')) as Map
		def comparisonOperation = ((specification.get('paths') as Map)
				?.get('/api/v1/members/me/ratings/comparison') as Map)?.get('get') as Map
		def responseSchema = (((comparisonOperation?.get('responses') as Map)?.get('200') as Map)
				?.get('content') as Map)?.get('application/json') as Map
		def schemaReference = (responseSchema?.get('schema') as Map)?.get('\$ref') as String
		if (schemaReference == null) {
			throw new GradleException('OpenAPI specification is missing rating comparison response schema')
		}
		def schemaName = schemaReference.substring(schemaReference.lastIndexOf('/') + 1)
		def comparisonSchema = (((specification.get('components') as Map)?.get('schemas') as Map)
				?.get(schemaName) as Map)
		['lower', 'current', 'higher'].each { propertyName ->
			def property = comparisonSchema?.get('properties') as Map
			def nullableProperty = property?.get(propertyName) as Map
			if (nullableProperty == null) {
				throw new GradleException("OpenAPI specification is missing rating comparison ${propertyName} property")
			}
			// ePages 0.20.1 does not emit nullable for optional object fields with nested descriptors.
			nullableProperty.put('nullable', true)
		}

		def components = (specification.get('components') as Map) ?: [:]
		specification.put('components', components)
		def schemas = (components.get('schemas') as Map) ?: [:]
		components.put('schemas', schemas)
		def dereferenceSchema = { schema ->
			def reference = (schema as Map)?.get('\$ref') as String
			if (reference == null) {
				return schema as Map
			}
			return schemas.get(reference.substring(reference.lastIndexOf('/') + 1)) as Map
		}
		def operationParameter = { path, method, name ->
			def parameters = (((specification.get('paths') as Map)?.get(path) as Map)?.get(method) as Map)
				?.get('parameters') as List
			return parameters?.find { parameter -> (parameter as Map)?.get('name') == name } as Map
		}
		def requestSchema = { path, method ->
			def operation = ((specification.get('paths') as Map)?.get(path) as Map)?.get(method) as Map
			def content = ((operation?.get('requestBody') as Map)?.get('content') as Map)?.values()?.first() as Map
			return dereferenceSchema(content?.get('schema'))
		}
		def responseSchemaForPath = { path, method, status ->
			def operation = ((specification.get('paths') as Map)?.get(path) as Map)?.get(method) as Map
			def response = ((operation?.get('responses') as Map)?.get(status) as Map)
			def content = ((response?.get('content') as Map)?.values()?.find { value ->
				(value as Map)?.get('schema') != null
			}) as Map
			return dereferenceSchema(content?.get('schema'))
		}
		def setEnum = { path, method, name, values, defaultValue = null ->
			def schema = (operationParameter(path, method, name)?.get('schema')) as Map
			schema?.put('enum', values)
			if (defaultValue != null) {
				schema?.put('default', defaultValue)
			}
		}
		def requestProperty = { path, method, name ->
			def schema = requestSchema(path, method)
			return (schema?.get('properties') as Map)?.get(name) as Map
		}
		def constrainString = { path, method, name, maxLength ->
			requestProperty(path, method, name)?.put('maxLength', maxLength)
		}
		def constrainReadingStatus = { property ->
			property?.put('enum', ['WANT_TO_READ', 'READING', 'FINISHED'])
		}
		def markRequiredNullable = { schema, propertyName ->
			def resolvedSchema = dereferenceSchema(schema)
			def required = (resolvedSchema?.get('required') as List) ?: []
			if (!required.contains(propertyName)) {
				required.add(propertyName)
			}
			resolvedSchema?.put('required', required)
			((resolvedSchema?.get('properties') as Map)?.get(propertyName) as Map)?.put('nullable', true)
		}
		def arrayItemSchema = { schema, propertyName ->
			def property = ((dereferenceSchema(schema)?.get('properties') as Map)?.get(propertyName)) as Map
			return dereferenceSchema(property?.get('items'))
		}
		def appendOperationDescription = { path, method, addition ->
			def operation = ((specification.get('paths') as Map)?.get(path) as Map)?.get(method) as Map
			def description = operation?.get('description')?.toString() ?: ''
			operation?.put('description', description ? ("${description}\n\n${addition}").toString() : addition.toString())
		}
		def addOptionalHeaderParameter = { path, method, name, description ->
			def operation = ((specification.get('paths') as Map)?.get(path) as Map)?.get(method) as Map
			def parameters = (operation?.get('parameters') as List) ?: []
			if (!parameters.any { parameter -> (parameter as Map)?.get('name') == name }) {
				parameters.add([name: name, in: 'header', required: false, description: description,
				                schema: [type: 'string']])
			}
			operation?.put('parameters', parameters)
		}
		def addJsonExample = { path, method, status, name, summary, value ->
			def operation = ((specification.get('paths') as Map)?.get(path) as Map)?.get(method) as Map
			def response = ((operation?.get('responses') as Map)?.get(status) as Map)
			def content = ((response?.get('content') as Map)?.get('application/json')) as Map
			def examples = (content?.get('examples') as Map) ?: [:]
			content?.put('examples', examples)
			examples.put(name, [summary: summary, value: value])
		}

		['/api/v1/books', '/api/v1/library', '/api/v1/books/{bookId}/reviews',
		 '/api/v1/reviews/{reviewId}/replies'].each { path ->
			(operationParameter(path, 'get', 'page')?.get('schema') as Map)?.put('minimum', 1)
		}
		setEnum('/api/v1/library', 'get', 'status', ['WANT_TO_READ', 'READING', 'FINISHED'])
		setEnum('/api/v1/library', 'get', 'sort', ['RECENT', 'OLDEST', 'COMMENT', 'RATING', 'TITLE'], 'RECENT')
		setEnum('/api/v1/books', 'get', 'sort', ['LATEST', 'COMMENT'], 'LATEST')
		setEnum('/api/v1/books/{bookId}/reviews', 'get', 'feed', ['ALL', 'MINE'], 'ALL')
		setEnum('/api/v1/books/{bookId}/reviews', 'get', 'sort', ['PAGE', 'LATEST', 'OLDEST', 'POPULAR'], 'PAGE')

		def ratingProperty = (requestSchema('/api/v1/library/{bookId}/rating', 'put')?.get('properties') as Map)
			?.get('rating') as Map
		ratingProperty?.putAll([minimum: 0.1, maximum: 5.0, multipleOf: 0.1])
		constrainReadingStatus(requestProperty('/api/v1/library', 'post', 'status'))
		constrainReadingStatus(requestProperty('/api/v1/library/{bookId}', 'patch', 'status'))
		constrainReadingStatus(requestProperty('/api/v1/library/bulk-status', 'patch', 'status'))
		requestProperty('/api/v1/library/{bookId}', 'patch', 'currentPage')?.put('minimum', 0)
		requestProperty('/api/v1/library/{bookId}', 'patch', 'totalPages')?.put('minimum', 1)
		requestProperty('/api/v1/library', 'post', 'totalPages')?.put('minimum', 1)
		constrainString('/api/v1/books/{bookId}/reviews', 'post', 'content', 1000)
		constrainString('/api/v1/books/{bookId}/reviews', 'post', 'quote', 500)
		constrainString('/api/v1/books/{bookId}/reviews', 'post', 'chapter', 255)
		constrainString('/api/v1/books/by-isbn/{isbn13}/reviews', 'post', 'content', 1000)
		constrainString('/api/v1/books/by-isbn/{isbn13}/reviews', 'post', 'quote', 500)
		constrainString('/api/v1/books/by-isbn/{isbn13}/reviews', 'post', 'chapter', 255)
		constrainString('/api/v1/reviews/{reviewId}', 'patch', 'content', 1000)
		constrainString('/api/v1/reviews/{reviewId}', 'patch', 'quote', 500)
		constrainString('/api/v1/reviews/{reviewId}', 'patch', 'chapter', 255)
		constrainString('/api/v1/reviews/{reviewId}/replies', 'post', 'content', 200)
		constrainString('/api/v1/replies/{replyId}', 'patch', 'content', 200)
		requestProperty('/api/v1/members/me/nickname', 'patch', 'nickname')
				?.putAll([minLength: 1, maxLength: 100])
		requestProperty('/api/v1/books/{bookId}/reviews', 'post', 'isSpoiler')?.putAll([nullable: false, default: false])
		requestProperty('/api/v1/books/by-isbn/{isbn13}/reviews', 'post', 'isSpoiler')?.putAll([nullable: false, default: false])
		requestProperty('/api/v1/reviews/{reviewId}', 'patch', 'content')?.remove('nullable')
		requestProperty('/api/v1/reviews/{reviewId}', 'patch', 'isSpoiler')?.remove('nullable')
		['/api/v1/auth/mobile/google', '/api/v1/auth/mobile/apple'].each { path ->
			addOptionalHeaderParameter(path, 'post', 'X-Guest-Token',
					'신규 회원가입 시 기존 게스트 Actor, 닉네임과 공개 상호작용을 계승할 게스트 토큰')
		}
		def guestInteractionGuidance = '회원 Access Token 또는 X-Guest-Token으로 요청할 수 있습니다. 게스트는 자신이 생성한 데이터만 수정·삭제 또는 좋아요 취소할 수 있습니다.'
		[
			['/api/v1/books/{bookId}/reviews', 'post'],
			['/api/v1/books/by-isbn/{isbn13}/reviews', 'post'],
			['/api/v1/reviews/{reviewId}', 'patch'], ['/api/v1/reviews/{reviewId}', 'delete'],
			['/api/v1/reviews/{reviewId}/replies', 'post'],
			['/api/v1/replies/{replyId}', 'patch'], ['/api/v1/replies/{replyId}', 'delete'],
			['/api/v1/reviews/{reviewId}/reactions', 'post'], ['/api/v1/reviews/{reviewId}/reactions', 'delete'],
			['/api/v1/replies/{replyId}/reactions', 'post'], ['/api/v1/replies/{replyId}/reactions', 'delete']
		].each { operation -> appendOperationDescription(operation[0], operation[1], guestInteractionGuidance) }
		appendOperationDescription('/api/v1/books/{bookId}/reviews', 'post',
				'게스트는 currentPage와 totalPages를 입력할 수 없으며 서재·독서 기록은 변경되지 않습니다.')
		appendOperationDescription('/api/v1/books/by-isbn/{isbn13}/reviews', 'post',
				'게스트는 currentPage와 totalPages를 입력할 수 없으며 서재·독서 기록은 변경되지 않습니다.')
		['/api/v1/library/bulk-delete', '/api/v1/library/bulk-status'].each { path ->
			def method = path.endsWith('bulk-delete') ? 'post' : 'patch'
			def bookIds = (requestSchema(path, method)?.get('properties') as Map)?.get('bookIds') as Map
			bookIds?.putAll([minItems: 1, maxItems: 10, uniqueItems: true])
			bookIds?.put('items', [type: 'integer', format: 'int64'])
		}

		def searchResponse = responseSchemaForPath('/api/v1/books', 'get', '200')
		markRequiredNullable(searchResponse, 'nextPage')
		def searchItem = arrayItemSchema(searchResponse, 'items')
		markRequiredNullable(searchItem, 'bookId')
	['reviewCount', 'replyCount', 'isRegisteredInMyLibrary'].each { propertyName ->
		markRequiredNullable(searchItem, propertyName)
	}
	def detailResponse = responseSchemaForPath('/api/v1/books/by-isbn/{isbn13}', 'get', '200')
	['bookId', 'reviewCount', 'replyCount', 'averageRating', 'ratingCount', 'myRatingCount', 'myRecord', 'totalPages'].each { propertyName -> markRequiredNullable(detailResponse, propertyName) }
		def libraryResponse = responseSchemaForPath('/api/v1/library', 'get', '200')
		markRequiredNullable(libraryResponse, 'nextPage')
		def libraryItem = arrayItemSchema(libraryResponse, 'items')
		['totalPages', 'rating'].each { propertyName -> markRequiredNullable(libraryItem, propertyName) }
		def reviewPageResponse = responseSchemaForPath('/api/v1/books/{bookId}/reviews', 'get', '200')
		markRequiredNullable(reviewPageResponse, 'nextPage')
		def reviewItem = arrayItemSchema(reviewPageResponse, 'items')
		['quote', 'chapter', 'currentPage'].each { propertyName -> markRequiredNullable(reviewItem, propertyName) }
		def memberResponse = responseSchemaForPath('/api/v1/members/me', 'get', '200')
		['nickname', 'profileImageUrl'].each { propertyName -> markRequiredNullable(memberResponse, propertyName) }
		(schemas.get('ProblemDetail') as Map)?.get('required')?.remove('instance')

		appendOperationDescription('/api/v1/library/{bookId}', 'patch',
				'`status`와 `currentPage` 중 정확히 하나를 보내야 합니다. `totalPages`는 페이지 검증에만 사용되는 보조 값입니다. `WANT_TO_READ`는 `currentPage`를 0으로 만들고, `FINISHED`는 전체 페이지를 알아야 하며 마지막 페이지로 설정합니다. `currentPage`가 전체 페이지와 같으면 `FINISHED`, 작으면 `READING`이며 초과하면 `INVALID_READING_STATE`입니다.')
		appendOperationDescription('/api/v1/reviews/{reviewId}', 'patch',
				'필드를 생략하면 기존 값을 유지합니다. `quote`, `chapter`, `currentPage`는 `null`을 보내면 삭제하고, `content`와 `isSpoiler`는 `null`을 보낼 수 없습니다. 빈 객체는 허용되지 않습니다.')
		appendOperationDescription('/api/v1/library', 'get',
				'`page`는 1부터 시작하고 한 페이지에 최대 10개입니다. 마지막 페이지의 `nextPage`는 `null`이며, 범위를 벗어난 페이지도 200과 빈 `items`로 응답합니다. 같은 정렬 값의 항목은 일관된 순서로 반환됩니다.')
		appendOperationDescription('/api/v1/books/{bookId}/reviews', 'get',
				'`page`는 1부터 시작하고 한 페이지에 최대 10개입니다. `POPULAR`는 좋아요 수와 답글 수를 합산한 인기순이며, 같은 정렬 값의 항목은 일관된 순서로 반환됩니다. 마지막 페이지의 `nextPage`는 `null`이고 범위를 벗어난 페이지는 200과 빈 `items`입니다.')
		addJsonExample('/api/v1/books', 'get', '200', 'search-registered-book', '서재에 등록된 도서', [
			 totalCount: 1, nextPage: null,
			 items: [[bookId: 10, title: '채식주의자', coverImageUrl: 'https://example.com/book.jpg',
				 authors: ['한강'], translators: [], publishedDate: '2007-10-30', isbn13: '9788936433598',
				 category: '국내도서>소설', publisher: '창비', reviewCount: 1, replyCount: 1,
				 isRegisteredInMyLibrary: true]]
		])
		addJsonExample('/api/v1/books', 'get', '200', 'search-unregistered-book', '서재에 등록하지 않은 도서', [
			 totalCount: 1, nextPage: null,
			 items: [[bookId: null, title: '마션', coverImageUrl: 'https://example.com/book.jpg',
				 authors: ['앤디 위어'], translators: [], publishedDate: '2015-07-10', isbn13: '9788925568683',
				 category: '국내도서>소설', publisher: '알에이치코리아', reviewCount: null, replyCount: null,
				 isRegisteredInMyLibrary: false]]
		])
		addJsonExample('/api/v1/books', 'get', '200', 'search-guest-book', '비로그인 사용자의 도서 검색', [
			 totalCount: 1, nextPage: null,
			 items: [[bookId: null, title: '마션', coverImageUrl: 'https://example.com/book.jpg',
				 authors: ['앤디 위어'], translators: [], publishedDate: '2015-07-10', isbn13: '9788925568683',
				 category: '국내도서>소설', publisher: '알에이치코리아', reviewCount: null, replyCount: null,
				 isRegisteredInMyLibrary: null]]
		])
		addJsonExample('/api/v1/books/by-isbn/{isbn13}', 'get', '200', 'book-detail-without-library-record', '비로그인 사용자의 도서 상세', [
			 bookId: 10, isbn13: '9788936433598', title: '채식주의자', coverImageUrl: 'https://example.com/book.jpg',
			 authors: ['한강'], translators: [], publisher: '창비', category: '국내도서>소설', publishedDate: '2007-10-30',
				 totalPages: 368, reviewCount: 1, replyCount: 1, averageRating: 4.3, ratingCount: 21, myRatingCount: null, myRecord: null
		])
		addJsonExample('/api/v1/books/{bookId}/reviews', 'get', '200', 'review-normal', '일반 감상', [
			 totalCount: 1, nextPage: null,
			 items: [[reviewId: 101, content: '인상 깊었다.', quote: null, chapter: null, currentPage: null,
				 isSpoiler: false, deleted: false, createdAt: '2026-08-13T15:00:00Z',
				 author: [displayName: '닉네임', profileImageUrl: null, anonymous: false, mine: false], likeCount: 0,
				 likedByMe: false, replyCount: 0, recentReplies: []]]
		])
		addJsonExample('/api/v1/books/{bookId}/reviews', 'get', '200', 'review-spoiler', '스포일러 감상', [
			 totalCount: 1, nextPage: null,
			 items: [[reviewId: 101, content: '결말에 대한 감상', quote: null, chapter: null, currentPage: null,
				 isSpoiler: true, deleted: false, createdAt: '2026-08-13T15:00:00Z',
				 author: [displayName: '닉네임', profileImageUrl: null, anonymous: false, mine: false], likeCount: 0,
				 likedByMe: false, replyCount: 0, recentReplies: []]]
		])
		addJsonExample('/api/v1/books/{bookId}/reviews', 'get', '200', 'review-deleted', '삭제된 감상', [
			 totalCount: 1, nextPage: null,
			 items: [[reviewId: 101, content: '삭제된 감상입니다.', quote: null, chapter: null, currentPage: null,
				 isSpoiler: false, deleted: true, createdAt: '2026-08-13T15:00:00Z',
				 author: [displayName: '닉네임', profileImageUrl: null, anonymous: false, mine: false], likeCount: 0,
				 likedByMe: false, replyCount: 0, recentReplies: []]]
		])
		components.put('securitySchemes', [
			bearerAuth: [
				type: 'http',
				scheme: 'bearer',
				bearerFormat: 'JWT'
			],
			accessTokenCookie: [
				type: 'apiKey',
				in: 'cookie',
				name: 'access_token'
			],
			guestToken: [
				type: 'apiKey',
				in: 'header',
				name: 'X-Guest-Token',
				description: '게스트 공개 상호작용 인증 토큰'
			]
		])

		def isPublicOperation = { path, method ->
			if (path.startsWith('/api/v1/auth/')) {
				return true
			}
			if (method != 'get') {
				return false
			}
			return path.startsWith('/api/v1/home/')
					|| path == '/api/v1/books'
					|| path == '/api/v1/books/by-isbn/{isbn13}'
					|| path == '/api/v1/books/{bookId}/reviews'
					|| path == '/api/v1/reviews/{reviewId}/replies'
		}
		def memberSecurityRequirement = [[bearerAuth: []], [accessTokenCookie: []]]
		def guestOnlySecurityRequirement = [[guestToken: []]]
		def publicInteractionSecurityRequirement = memberSecurityRequirement + [[guestToken: []]]
		def publicInteractionOperations = [
			['/api/v1/books/{bookId}/reviews', 'post'],
			['/api/v1/books/by-isbn/{isbn13}/reviews', 'post'],
			['/api/v1/reviews/{reviewId}', 'patch'], ['/api/v1/reviews/{reviewId}', 'delete'],
			['/api/v1/reviews/{reviewId}/replies', 'post'],
			['/api/v1/replies/{replyId}', 'patch'], ['/api/v1/replies/{replyId}', 'delete'],
			['/api/v1/reviews/{reviewId}/reactions', 'post'], ['/api/v1/reviews/{reviewId}/reactions', 'delete'],
			['/api/v1/replies/{replyId}/reactions', 'post'], ['/api/v1/replies/{replyId}/reactions', 'delete']
		]
		def httpMethods = ['get', 'post', 'put', 'patch', 'delete', 'options', 'head', 'trace'] as Set
		(specification.get('paths') as Map).each { path, pathItem ->
			(pathItem as Map).each { method, operation ->
				if (httpMethods.contains(method.toString())) {
					if ((path.toString() == '/api/v1/auth/guest-token/refresh'
							|| path.toString() == '/api/v1/auth/oauth2/guest-context')
							&& method.toString() == 'post') {
						(operation as Map).put('security', guestOnlySecurityRequirement)
					} else if (isPublicOperation(path.toString(), method.toString())) {
						(operation as Map).remove('security')
					} else if (publicInteractionOperations.contains([path.toString(), method.toString()])) {
						(operation as Map).put('security', publicInteractionSecurityRequirement)
					} else {
						(operation as Map).put('security', memberSecurityRequirement)
					}
				}
			}
		}
		sourceFile.withWriter('UTF-8') { writer -> new Yaml().dump(specification, writer) }
	}
}

def stageOpenApiSpec = tasks.register('stageOpenApiSpec') {
	dependsOn 'verifyOpenApi'
	inputs.file openApiSpecFile
	outputs.file stagedOpenApiSpecFile
	doLast {
		def sourceFile = openApiSpecFile.get().asFile
		def targetFile = stagedOpenApiSpecFile.get().asFile
		if (!sourceFile.isFile()) {
			throw new GradleException("OpenAPI specification was not generated: ${sourceFile}")
		}
		java.nio.file.Files.createDirectories(targetFile.parentFile.toPath())
		java.nio.file.Files.copy(
				sourceFile.toPath(),
				targetFile.toPath(),
				java.nio.file.StandardCopyOption.REPLACE_EXISTING
		)
	}
}

tasks.register('verifyOpenApi') {
	dependsOn 'openapi3'
	inputs.file openApiSpecFile
	doLast {
		def sourceFile = openApiSpecFile.get().asFile
		if (!sourceFile.isFile()) {
			throw new GradleException("OpenAPI specification was not generated: ${sourceFile}")
		}

		def specificationText = sourceFile.getText('UTF-8')
		def specification = new Yaml().load(specificationText) as Map
		def info = specification?.get('info') as Map
		def infoDescription = info?.get('description')?.toString() ?: ''
		['Swagger 이용 안내', '웹 인증', '모바일 인증', '게스트 인증', 'ProblemDetail'].each { requiredSection ->
			if (!infoDescription.contains(requiredSection)) {
				throw new GradleException("OpenAPI info description is missing ${requiredSection} guidance")
			}
		}
		if (!infoDescription.contains('`code`')) {
			throw new GradleException('OpenAPI info description is missing ProblemDetail code guidance')
		}
		if (info?.get('version')?.toString()?.contains('SNAPSHOT')) {
			throw new GradleException('OpenAPI specification must not expose a SNAPSHOT version')
		}
		def paths = specification?.get('paths') as Map
		def booksPath = paths?.get('/api/v1/books') as Map
		if (booksPath == null) {
			throw new GradleException('OpenAPI specification is missing path /api/v1/books')
		}

		def getOperation = booksPath.get('get') as Map
		if (getOperation == null) {
			throw new GradleException('OpenAPI specification is missing GET operation for /api/v1/books')
		}
		if (getOperation.get('summary') != '도서 검색') {
			throw new GradleException('OpenAPI specification has invalid summary for GET /api/v1/books')
		}
		if (getOperation.get('description') != '도서명과 페이지 번호 및 정렬 기준으로 도서를 검색한다') {
			throw new GradleException('OpenAPI specification has invalid description for GET /api/v1/books')
		}

		def responses = (getOperation.get('responses') as Map)?.collectEntries { status, response ->
			[(status.toString()): response]
		}
		if (responses == null) {
			throw new GradleException('OpenAPI specification is missing responses for GET /api/v1/books')
		}

		def requiredResponseCodes = ['200', '400', '500', '502'] as Set
		requiredResponseCodes.each { responseCode ->
			if (!responses.containsKey(responseCode)) {
				throw new GradleException("OpenAPI specification is missing response ${responseCode}")
			}
		}
		['400', '500', '502'].each { responseCode ->
			def response = responses.get(responseCode) as Map
			def content = response?.get('content') as Map
			def problemContent = content?.get('application/problem+json') as Map
			if (problemContent == null) {
				throw new GradleException("OpenAPI specification is missing application/problem+json for response ${responseCode}")
			}
			def schema = problemContent.get('schema') as Map
			if (schema?.get('\$ref') != '#/components/schemas/ProblemDetail') {
				throw new GradleException("OpenAPI specification is missing ProblemDetail schema for response ${responseCode}")
			}
		}

		def requiredLibraryOperations = [
			'/api/v1/library'                         : ['get': ['200', '400', '401'], 'post': ['201', '400', '401', '404', '409', '422']],
			'/api/v1/library/bulk-delete'             : ['post': ['204', '400', '401', '404']],
			'/api/v1/library/bulk-status'             : ['patch': ['204', '400', '401', '404', '422']],
			'/api/v1/library/{bookId}'                : ['patch': ['200', '400', '401', '404', '409', '422'], 'delete': ['204', '401', '404']],
			'/api/v1/library/{bookId}/rating'         : ['put': ['200', '400', '401', '404'], 'delete': ['204', '401', '404']],
			'/api/v1/members/me/ratings/comparison'   : ['get': ['200', '400', '401', '404']]
		]
		requiredLibraryOperations.each { path, expectedOperations ->
			def pathItem = paths?.get(path) as Map
			if (pathItem == null) {
				throw new GradleException("OpenAPI specification is missing path ${path}")
			}
			expectedOperations.each { method, expectedResponseCodes ->
				def operation = pathItem.get(method) as Map
				if (operation == null) {
					throw new GradleException("OpenAPI specification is missing ${method.toUpperCase()} operation for ${path}")
				}
				def operationResponses = (operation.get('responses') as Map)?.collectEntries { status, response ->
					[(status.toString()): response]
				}
				if (operationResponses == null || !operationResponses.keySet().containsAll(expectedResponseCodes)) {
					throw new GradleException("OpenAPI specification has incomplete responses for ${method.toUpperCase()} ${path}")
				}
			}
		}

		def reviewOperations = [
			'/api/v1/books/{bookId}/reviews'       : [get: '200', post: '201'],
			'/api/v1/books/by-isbn/{isbn13}/reviews': [post: '201'],
			'/api/v1/reviews/{reviewId}'           : [patch: '200', delete: '204'],
			'/api/v1/reviews/{reviewId}/replies'   : [get: '200', post: '201'],
			'/api/v1/replies/{replyId}'            : [patch: '200', delete: '204'],
			'/api/v1/reviews/{reviewId}/reactions' : [post: '201', delete: '204'],
			'/api/v1/replies/{replyId}/reactions'  : [post: '201', delete: '204']
		]
		reviewOperations.each { path, operations ->
			def pathItem = paths?.get(path) as Map
			if (pathItem == null) {
				throw new GradleException("OpenAPI specification is missing path ${path}")
			}
			operations.each { method, successStatus ->
				def operation = pathItem.get(method) as Map
				if (operation == null) {
					throw new GradleException("OpenAPI specification is missing ${method.toUpperCase()} operation for ${path}")
				}
				def operationResponses = (operation.get('responses') as Map)?.collectEntries { status, response ->
					[(status.toString()): response]
				}
				if (operationResponses == null || !operationResponses.containsKey(successStatus)) {
					throw new GradleException("OpenAPI specification is missing ${successStatus} response for ${method.toUpperCase()} ${path}")
				}
			}
		}

		def authOperations = [
			'/api/v1/auth/guest-token'     : [post: ['201']],
			'/api/v1/auth/guest-token/refresh': [post: ['200', '401', '409']],
			'/api/v1/auth/oauth2/guest-context': [post: ['204', '401']],
			'/api/v1/auth/mobile/google'   : [post: ['200', '400']],
			'/api/v1/auth/mobile/reissue' : [post: ['200', '400']],
			'/api/v1/auth/mobile/logout'  : [post: ['204', '400']],
			'/api/v1/auth/reissue'        : [post: ['204']],
			'/api/v1/auth/logout'         : [post: ['204']],
			'/api/v1/members/me'          : [get: ['200', '401'], delete: ['204', '401']],
			'/api/v1/members/me/nickname' : [patch: ['200', '400', '401', '409']],
			'/api/v1/members/me/anonymity': [patch: ['200', '400', '401', '422']]
		]
		authOperations.each { path, operations ->
			def pathItem = paths?.get(path) as Map
			if (pathItem == null) {
				throw new GradleException("OpenAPI specification is missing path ${path}")
			}
			operations.each { method, expectedResponseCodes ->
				def operation = pathItem.get(method) as Map
				if (operation == null) {
					throw new GradleException("OpenAPI specification is missing ${method.toUpperCase()} operation for ${path}")
				}
				def operationResponses = (operation.get('responses') as Map)?.collectEntries { status, response ->
					[(status.toString()): response]
				}
				if (operationResponses == null || !operationResponses.keySet().containsAll(expectedResponseCodes)) {
					throw new GradleException("OpenAPI specification has incomplete responses for ${method.toUpperCase()} ${path}")
				}
			}
		}

		def securitySchemes = ((specification?.get('components') as Map)?.get('securitySchemes') as Map)
		def bearerAuth = securitySchemes?.get('bearerAuth') as Map
		if (bearerAuth?.get('type') != 'http' || bearerAuth?.get('scheme') != 'bearer') {
			throw new GradleException('OpenAPI specification is missing bearerAuth security scheme')
		}
		def accessTokenCookie = securitySchemes?.get('accessTokenCookie') as Map
		if (accessTokenCookie?.get('type') != 'apiKey'
				|| accessTokenCookie?.get('in') != 'cookie'
				|| accessTokenCookie?.get('name') != 'access_token') {
			throw new GradleException('OpenAPI specification is missing accessTokenCookie security scheme')
		}
		def guestToken = securitySchemes?.get('guestToken') as Map
		if (guestToken?.get('type') != 'apiKey'
				|| guestToken?.get('in') != 'header'
				|| guestToken?.get('name') != 'X-Guest-Token') {
			throw new GradleException('OpenAPI specification is missing guestToken security scheme')
		}
		def expectedMemberSecurityRequirement = [[bearerAuth: []], [accessTokenCookie: []]]
		def expectedGuestOnlySecurityRequirement = [[guestToken: []]]
		def expectedPublicInteractionSecurityRequirement = expectedMemberSecurityRequirement + [[guestToken: []]]
		def publicInteractionOperations = [
			['/api/v1/books/{bookId}/reviews', 'post'],
			['/api/v1/books/by-isbn/{isbn13}/reviews', 'post'],
			['/api/v1/reviews/{reviewId}', 'patch'], ['/api/v1/reviews/{reviewId}', 'delete'],
			['/api/v1/reviews/{reviewId}/replies', 'post'],
			['/api/v1/replies/{replyId}', 'patch'], ['/api/v1/replies/{replyId}', 'delete'],
			['/api/v1/reviews/{reviewId}/reactions', 'post'], ['/api/v1/reviews/{reviewId}/reactions', 'delete'],
			['/api/v1/replies/{replyId}/reactions', 'post'], ['/api/v1/replies/{replyId}/reactions', 'delete']
		]
		def publicOperation = { path, method ->
			if (path.toString().startsWith('/api/v1/auth/')) {
				return true
			}
			if (method.toString() != 'get') {
				return false
			}
			return path.toString().startsWith('/api/v1/home/')
					|| path.toString() == '/api/v1/books'
					|| path.toString() == '/api/v1/books/by-isbn/{isbn13}'
					|| path.toString() == '/api/v1/books/{bookId}/reviews'
					|| path.toString() == '/api/v1/reviews/{reviewId}/replies'
		}
		def openApiHttpMethods = ['get', 'post', 'put', 'patch', 'delete', 'options', 'head', 'trace'] as Set
		paths.each { path, pathItem ->
			(pathItem as Map).each { method, operation ->
				if (!openApiHttpMethods.contains(method.toString())) {
					return
				}
				def security = (operation as Map).get('security')
				if ((path.toString() == '/api/v1/auth/guest-token/refresh'
						|| path.toString() == '/api/v1/auth/oauth2/guest-context')
						&& method.toString() == 'post') {
					if (security != expectedGuestOnlySecurityRequirement) {
						throw new GradleException("OpenAPI specification is missing guest-only authentication for POST ${path}")
					}
				} else if (publicOperation(path, method)) {
					if (security != null) {
						throw new GradleException("OpenAPI specification adds authentication to public ${method.toString().toUpperCase()} ${path}")
					}
				} else if (publicInteractionOperations.contains([path.toString(), method.toString()])) {
					if (security != expectedPublicInteractionSecurityRequirement) {
						throw new GradleException("OpenAPI specification is missing guest authentication for ${method.toString().toUpperCase()} ${path}")
					}
				} else if (security != expectedMemberSecurityRequirement) {
					throw new GradleException("OpenAPI specification is missing alternative authentication for ${method.toString().toUpperCase()} ${path}")
				}
			}
		}

		def libraryListResponses = ((paths.get('/api/v1/library') as Map).get('get') as Map)
				.get('responses') as Map
		def libraryBadRequest = libraryListResponses?.get('400') as Map
		def libraryProblemContent = (libraryBadRequest?.get('content') as Map)?.get('application/problem+json') as Map
		if ((libraryProblemContent?.get('schema') as Map)?.get('\$ref') != '#/components/schemas/ProblemDetail') {
			throw new GradleException('OpenAPI specification is missing ProblemDetail schema for GET /api/v1/library 400 response')
		}

		def problemResponseCodes = [
			'/api/v1/library'                         : ['get': ['400', '401'], 'post': ['400', '401', '404', '409', '422']],
			'/api/v1/library/bulk-delete'             : ['post': ['400', '401', '404']],
			'/api/v1/library/bulk-status'             : ['patch': ['400', '401', '404', '422']],
			'/api/v1/library/{bookId}'                : ['patch': ['400', '401', '404', '409', '422'], 'delete': ['401', '404']],
			'/api/v1/library/{bookId}/rating'         : ['put': ['400', '401', '404'], 'delete': ['401', '404']],
			'/api/v1/members/me/ratings/comparison'   : ['get': ['400', '401', '404']]
		]
		problemResponseCodes.each { path, operations ->
			operations.each { method, responseCodes ->
				def operationResponses = (((paths.get(path) as Map).get(method) as Map).get('responses') as Map)
				responseCodes.each { responseCode ->
					def problemContent = ((operationResponses.get(responseCode) as Map)?.get('content') as Map)
							?.get('application/problem+json') as Map
					if ((problemContent?.get('schema') as Map)?.get('\$ref') != '#/components/schemas/ProblemDetail') {
						throw new GradleException("OpenAPI specification is missing ProblemDetail schema for ${method.toUpperCase()} ${path} ${responseCode} response")
					}
				}
			}
		}

		def reviewProblemDetails = [
			'/api/v1/books/{bookId}/reviews': [
				get : ['400': ['INVALID_REQUEST'], '401': ['UNAUTHORIZED'], '404': ['BOOK_NOT_FOUND']],
				post: ['400': ['INVALID_REQUEST'], '401': ['UNAUTHORIZED'], '404': ['BOOK_NOT_FOUND'],
						'409': ['TOTAL_PAGES_CONFLICT'], '422': ['INVALID_READING_STATE']]
			],
			'/api/v1/books/by-isbn/{isbn13}/reviews': [
				post: ['400': ['INVALID_REQUEST'], '401': ['UNAUTHORIZED'], '403': ['FORBIDDEN'],
						'404': ['BOOK_NOT_FOUND'], '409': ['TOTAL_PAGES_CONFLICT'],
						'422': ['INVALID_READING_STATE'], '502': ['EXTERNAL_API_ERROR']]
			],
			'/api/v1/reviews/{reviewId}': [
				patch : ['400': ['INVALID_REQUEST'], '401': ['UNAUTHORIZED'], '403': ['FORBIDDEN'], '404': ['REVIEW_NOT_FOUND'],
						'409': ['TOTAL_PAGES_CONFLICT', 'DELETED_RESOURCE'], '422': ['INVALID_READING_STATE']],
				delete: ['401': ['UNAUTHORIZED'], '403': ['FORBIDDEN'], '404': ['REVIEW_NOT_FOUND'], '409': ['DELETED_RESOURCE']]
			],
			'/api/v1/reviews/{reviewId}/replies': [
				get : ['400': ['INVALID_REQUEST'], '404': ['REVIEW_NOT_FOUND']],
				post: ['400': ['INVALID_REQUEST'], '401': ['UNAUTHORIZED'], '404': ['REVIEW_NOT_FOUND'], '409': ['DELETED_RESOURCE']]
			],
			'/api/v1/replies/{replyId}': [
				patch : ['400': ['INVALID_REQUEST'], '401': ['UNAUTHORIZED'], '403': ['FORBIDDEN'], '404': ['REPLY_NOT_FOUND'],
						'409': ['DELETED_RESOURCE']],
				delete: ['401': ['UNAUTHORIZED'], '403': ['FORBIDDEN'], '404': ['REPLY_NOT_FOUND'], '409': ['DELETED_RESOURCE']]
			],
			'/api/v1/reviews/{reviewId}/reactions': [
				post  : ['401': ['UNAUTHORIZED'], '404': ['REVIEW_NOT_FOUND'], '409': ['REACTION_ALREADY_EXISTS', 'DELETED_RESOURCE']],
				delete: ['401': ['UNAUTHORIZED'], '404': ['REVIEW_NOT_FOUND']]
			],
			'/api/v1/replies/{replyId}/reactions': [
				post  : ['401': ['UNAUTHORIZED'], '404': ['REPLY_NOT_FOUND'], '409': ['REACTION_ALREADY_EXISTS', 'DELETED_RESOURCE']],
				delete: ['401': ['UNAUTHORIZED'], '404': ['REPLY_NOT_FOUND']]
			]
		]
		reviewProblemDetails.each { path, operations ->
			operations.each { method, expectedResponses ->
				def operation = (paths.get(path) as Map).get(method) as Map
				def operationResponses = (operation.get('responses') as Map)?.collectEntries { status, response ->
					[(status.toString()): response]
				}
				expectedResponses.each { errorStatus, expectedCodes ->
					def response = operationResponses?.get(errorStatus) as Map
					def problemContent = (response?.get('content') as Map)?.get('application/problem+json') as Map
					def schema = problemContent?.get('schema') as Map
					if (schema?.get('\$ref') != '#/components/schemas/ProblemDetail') {
						throw new GradleException("OpenAPI specification is missing ${errorStatus} ProblemDetail for ${method.toUpperCase()} ${path}")
					}
					def examples = problemContent.get('examples') as Map
					expectedCodes.each { expectedCode ->
						def codeExists = examples?.values()?.any { example ->
							(example as Map)?.get('value')?.toString()?.contains("\"code\":\"${expectedCode}\"")
						}
						if (!codeExists) {
							throw new GradleException("OpenAPI specification is missing ${expectedCode} example for ${method.toUpperCase()} ${path}")
						}
					}
				}
			}
		}

		def libraryPostOperation = (paths.get('/api/v1/library') as Map).get('post') as Map
		def locationHeader = ((((libraryPostOperation.get('responses') as Map).get('201') as Map)
				?.get('headers') as Map)?.get('Location') as Map)
		if ((locationHeader?.get('schema') as Map)?.get('type') != 'string') {
			throw new GradleException('OpenAPI specification is missing string Location header for POST /api/v1/library 201 response')
		}

		def libraryQueryParameters = (((paths.get('/api/v1/library') as Map).get('get') as Map)
				?.get('parameters') as List)?.collectEntries { parameter -> [(parameter.get('name')): parameter] }
		if ((libraryQueryParameters?.get('page') as Map)?.get('schema')?.get('type') != 'integer'
				|| (libraryQueryParameters?.get('status') as Map)?.get('schema')?.get('type') != 'string'
				|| (libraryQueryParameters?.get('sort') as Map)?.get('schema')?.get('type') != 'string') {
			throw new GradleException('OpenAPI specification has invalid query parameter types for GET /api/v1/library')
		}
		def comparisonQueryParameters = (((paths.get('/api/v1/members/me/ratings/comparison') as Map).get('get') as Map)
				?.get('parameters') as List)?.collectEntries { parameter -> [(parameter.get('name')): parameter] }
		if ((comparisonQueryParameters?.get('isbn13') as Map)?.get('schema')?.get('type') != 'string'
				|| (comparisonQueryParameters?.get('criterion') as Map)?.get('schema')?.get('type') != 'number') {
			throw new GradleException('OpenAPI specification has invalid query parameter types for GET /api/v1/members/me/ratings/comparison')
		}

		def addRequestSchemaReference = (((libraryPostOperation.get('requestBody') as Map)?.get('content') as Map)
				?.values()?.first() as Map)?.get('schema')?.get('\$ref') as String
		def addRequestSchemaName = addRequestSchemaReference?.substring(addRequestSchemaReference.lastIndexOf('/') + 1)
		def addRequestSchema = (((specification.get('components') as Map)?.get('schemas') as Map)
				?.get(addRequestSchemaName) as Map)
		def addRequiredFields = addRequestSchema?.get('required') as List
		if (addRequiredFields == null || !addRequiredFields.containsAll(['isbn13', 'status'])
				|| addRequiredFields.contains('totalPages')) {
			throw new GradleException('OpenAPI specification has invalid required fields for POST /api/v1/library request')
		}

		def dereferenceSchema = { schema ->
			def reference = (schema as Map)?.get('\$ref') as String
			def schemaName = reference?.substring(reference.lastIndexOf('/') + 1)
			return (((specification.get('components') as Map)?.get('schemas') as Map)?.get(schemaName) as Map)
		}
		def queryParameter = { path, method, name ->
			def parameters = (((paths.get(path) as Map)?.get(method) as Map)?.get('parameters') as List)
			return parameters?.find { parameter -> (parameter as Map)?.get('name') == name } as Map
		}
		def requestSchema = { path, method ->
			def operation = (paths.get(path) as Map).get(method) as Map
			def content = ((operation?.get('requestBody') as Map)?.get('content') as Map)?.values()?.first() as Map
			return dereferenceSchema(content?.get('schema'))
		}
		def requestProperty = { path, method, name ->
			def schema = requestSchema(path, method)
			return (schema?.get('properties') as Map)?.get(name) as Map
		}
		def responseSchema = { path, method, status ->
			def operation = (paths.get(path) as Map).get(method) as Map
			def response = ((operation?.get('responses') as Map)?.get(status) as Map)
			def content = (response?.get('content') as Map)?.values()?.find { value ->
				(value as Map)?.get('schema') != null
			} as Map
			return dereferenceSchema(content?.get('schema'))
		}
		def requiredNullable = { schema, propertyName ->
			def required = (schema?.get('required') as List) ?: []
			def property = (schema?.get('properties') as Map)?.get(propertyName) as Map
			return required.contains(propertyName) && property?.get('nullable') == true
		}

		[
			[path: '/api/v1/books', method: 'get', name: 'page'],
			[path: '/api/v1/library', method: 'get', name: 'page'],
			[path: '/api/v1/books/{bookId}/reviews', method: 'get', name: 'page'],
			[path: '/api/v1/reviews/{reviewId}/replies', method: 'get', name: 'page']
		].each { requirement ->
			def schema = queryParameter(requirement.path, requirement.method, requirement.name)?.get('schema') as Map
			if (schema?.get('type') != 'integer' || schema?.get('minimum') != 1) {
				throw new GradleException("OpenAPI specification must constrain ${requirement.method.toUpperCase()} ${requirement.path} ${requirement.name} to a minimum of 1")
			}
		}

		[
			[path: '/api/v1/library', method: 'get', name: 'status', values: ['WANT_TO_READ', 'READING', 'FINISHED']],
			[path: '/api/v1/library', method: 'get', name: 'sort', values: ['RECENT', 'OLDEST', 'COMMENT', 'RATING', 'TITLE'], defaultValue: 'RECENT'],
			[path: '/api/v1/books', method: 'get', name: 'sort', values: ['LATEST', 'COMMENT'], defaultValue: 'LATEST'],
			[path: '/api/v1/books/{bookId}/reviews', method: 'get', name: 'feed', values: ['ALL', 'MINE'], defaultValue: 'ALL'],
			[path: '/api/v1/books/{bookId}/reviews', method: 'get', name: 'sort', values: ['PAGE', 'LATEST', 'OLDEST', 'POPULAR'], defaultValue: 'PAGE']
		].each { requirement ->
			def parameter = queryParameter(requirement.path, requirement.method, requirement.name)
			def schema = parameter?.get('schema') as Map
			if (schema?.get('enum') != requirement.values) {
				throw new GradleException("OpenAPI specification is missing enum values for ${requirement.method.toUpperCase()} ${requirement.path} ${requirement.name}")
			}
			if (requirement.defaultValue != null && schema?.get('default') != requirement.defaultValue) {
				throw new GradleException("OpenAPI specification is missing default value for ${requirement.method.toUpperCase()} ${requirement.path} ${requirement.name}")
			}
		}

		def ratingRequest = requestSchema('/api/v1/library/{bookId}/rating', 'put')
		def ratingProperty = (ratingRequest?.get('properties') as Map)?.get('rating') as Map
		if (ratingProperty?.get('type') != 'number' || ratingProperty?.get('minimum') != 0.1
				|| ratingProperty?.get('maximum') != 5.0 || ratingProperty?.get('multipleOf') != 0.1) {
			throw new GradleException('OpenAPI specification must constrain rating to 0.1 through 5.0 in 0.1 increments')
		}
		[
			[path: '/api/v1/books/{bookId}/reviews', method: 'post', name: 'content', maxLength: 1000],
			[path: '/api/v1/books/{bookId}/reviews', method: 'post', name: 'quote', maxLength: 500],
			[path: '/api/v1/books/{bookId}/reviews', method: 'post', name: 'chapter', maxLength: 255],
			[path: '/api/v1/books/by-isbn/{isbn13}/reviews', method: 'post', name: 'content', maxLength: 1000],
			[path: '/api/v1/books/by-isbn/{isbn13}/reviews', method: 'post', name: 'quote', maxLength: 500],
			[path: '/api/v1/books/by-isbn/{isbn13}/reviews', method: 'post', name: 'chapter', maxLength: 255],
			[path: '/api/v1/reviews/{reviewId}', method: 'patch', name: 'content', maxLength: 1000],
			[path: '/api/v1/reviews/{reviewId}', method: 'patch', name: 'quote', maxLength: 500],
			[path: '/api/v1/reviews/{reviewId}', method: 'patch', name: 'chapter', maxLength: 255],
			[path: '/api/v1/reviews/{reviewId}/replies', method: 'post', name: 'content', maxLength: 200],
			[path: '/api/v1/replies/{replyId}', method: 'patch', name: 'content', maxLength: 200]
		].each { requirement ->
			if ((requestProperty(requirement.path, requirement.method, requirement.name)?.get('maxLength')) != requirement.maxLength) {
				throw new GradleException("OpenAPI specification is missing maxLength for ${requirement.method.toUpperCase()} ${requirement.path} ${requirement.name}")
			}
		}
		[
			[path: '/api/v1/library', method: 'post', name: 'status'],
			[path: '/api/v1/library/{bookId}', method: 'patch', name: 'status'],
			[path: '/api/v1/library/bulk-status', method: 'patch', name: 'status']
		].each { requirement ->
			def property = requestProperty(requirement.path, requirement.method, requirement.name)
			if (property?.get('enum') != ['WANT_TO_READ', 'READING', 'FINISHED']) {
				throw new GradleException("OpenAPI specification is missing reading status enum for ${requirement.method.toUpperCase()} ${requirement.path}")
			}
		}
		if (requestProperty('/api/v1/books/{bookId}/reviews', 'post', 'isSpoiler')?.get('default') != false
				|| requestProperty('/api/v1/books/by-isbn/{isbn13}/reviews', 'post', 'isSpoiler')?.get('default') != false
				|| requestProperty('/api/v1/reviews/{reviewId}', 'patch', 'content')?.get('nullable') == true
				|| requestProperty('/api/v1/reviews/{reviewId}', 'patch', 'isSpoiler')?.get('nullable') == true) {
			throw new GradleException('OpenAPI specification has invalid nullability for review create/update fields')
		}

		[
			'/api/v1/library/bulk-delete',
			'/api/v1/library/bulk-status'
		].each { path ->
			def method = path.endsWith('bulk-delete') ? 'post' : 'patch'
			def schema = requestSchema(path, method)
			def bookIds = (schema?.get('properties') as Map)?.get('bookIds') as Map
			def items = bookIds?.get('items') as Map
			if (bookIds?.get('type') != 'array' || bookIds?.get('minItems') != 1
					|| bookIds?.get('maxItems') != 10 || bookIds?.get('uniqueItems') != true
					|| items?.get('type') != 'integer' || items?.get('format') != 'int64') {
				throw new GradleException("OpenAPI specification must constrain bookIds for ${method.toUpperCase()} ${path}")
			}
		}

		def searchResponse = responseSchema('/api/v1/books', 'get', '200')
		def searchItem = ((searchResponse?.get('properties') as Map)?.get('items') as Map)?.get('items') as Map
		if (!requiredNullable(searchResponse, 'nextPage') || !requiredNullable(searchItem, 'bookId')
				|| !requiredNullable(searchItem, 'reviewCount') || !requiredNullable(searchItem, 'replyCount')
				|| !requiredNullable(searchItem, 'isRegisteredInMyLibrary')) {
			throw new GradleException('OpenAPI specification must distinguish nullable book search fields from omitted fields')
		}
		def searchExamples = (((((paths.get('/api/v1/books') as Map).get('get') as Map)
				.get('responses') as Map).get('200') as Map).get('content') as Map)
				?.get('application/json')?.get('examples') as Map
		def searchExampleItem = { exampleName ->
			def response = ((searchExamples?.get(exampleName) as Map)?.get('value')) as Map
			def items = response?.get('items') as List
			return items == null || items.isEmpty() ? null : items.first() as Map
		}
		def registeredBookExample = searchExampleItem('search-registered-book')
		def unregisteredBookExample = searchExampleItem('search-unregistered-book')
		def guestBookExample = searchExampleItem('search-guest-book')
		if (registeredBookExample?.get('isRegisteredInMyLibrary') != true
				|| unregisteredBookExample?.get('isRegisteredInMyLibrary') != false
				|| !guestBookExample?.containsKey('isRegisteredInMyLibrary')
				|| guestBookExample?.get('isRegisteredInMyLibrary') != null) {
			throw new GradleException('OpenAPI specification must include book search library registration examples')
		}
		def detailResponse = responseSchema('/api/v1/books/by-isbn/{isbn13}', 'get', '200')
		if (!requiredNullable(detailResponse, 'bookId') || !requiredNullable(detailResponse, 'reviewCount')
				|| !requiredNullable(detailResponse, 'replyCount')
				|| !requiredNullable(detailResponse, 'averageRating') || !requiredNullable(detailResponse, 'ratingCount')
				|| !requiredNullable(detailResponse, 'myRatingCount')
				|| !requiredNullable(detailResponse, 'myRecord') || !requiredNullable(detailResponse, 'totalPages')) {
			throw new GradleException('OpenAPI specification must describe nullable book detail state fields')
		}
		def libraryResponse = responseSchema('/api/v1/library', 'get', '200')
		def libraryItem = ((libraryResponse?.get('properties') as Map)?.get('items') as Map)?.get('items') as Map
		if (!requiredNullable(libraryResponse, 'nextPage') || !requiredNullable(libraryItem, 'totalPages')
				|| !requiredNullable(libraryItem, 'rating')) {
			throw new GradleException('OpenAPI specification must describe nullable library fields')
		}
		def reviewPageResponse = responseSchema('/api/v1/books/{bookId}/reviews', 'get', '200')
		def reviewItem = ((reviewPageResponse?.get('properties') as Map)?.get('items') as Map)?.get('items') as Map
		if (!requiredNullable(reviewPageResponse, 'nextPage') || !requiredNullable(reviewItem, 'quote')
				|| !requiredNullable(reviewItem, 'chapter') || !requiredNullable(reviewItem, 'currentPage')) {
			throw new GradleException('OpenAPI specification must describe nullable review fields')
		}
		def problemDetailRequired = ((specification.get('components') as Map)?.get('schemas') as Map)
				?.get('ProblemDetail')?.get('required') as List
		if (problemDetailRequired?.contains('instance')) {
			throw new GradleException('OpenAPI ProblemDetail instance must be optional because authentication errors may omit it')
		}
		def comparisonSchema = dereferenceSchema((((paths.get('/api/v1/members/me/ratings/comparison') as Map)
				.get('get') as Map).get('responses') as Map).get('200').get('content').get('application/json').get('schema'))
		def comparisonProperties = comparisonSchema?.get('properties') as Map
		if ((comparisonProperties?.get('lower') as Map)?.get('nullable') != true
				|| (comparisonProperties?.get('higher') as Map)?.get('nullable') != true
				|| (comparisonProperties?.get('current') as Map)?.get('nullable') != true) {
			throw new GradleException('OpenAPI specification has invalid nullable fields for rating comparison')
		}
		def requiredComparisonBookFields = ['bookId', 'isbn13', 'title', 'coverImageUrl', 'authors', 'myRating', 'ratingUpdatedAt'] as Set
		['lower', 'higher'].each { propertyName ->
			def comparisonBook = comparisonProperties?.get(propertyName) as Map
			def requiredFields = comparisonBook?.get('required') as List
			def childProperties = comparisonBook?.get('properties') as Map
			if (requiredFields == null || !requiredFields.containsAll(requiredComparisonBookFields)
					|| requiredComparisonBookFields.any { fieldName -> childProperties?.get(fieldName)?.get('nullable') == true }) {
				throw new GradleException("OpenAPI specification has invalid required fields for rating comparison ${propertyName}")
			}
		}
		def currentComparisonBook = comparisonProperties?.get('current') as Map
		def currentRequiredFields = currentComparisonBook?.get('required') as Set
		if (currentRequiredFields == null || !currentRequiredFields.containsAll(requiredComparisonBookFields)) {
			throw new GradleException('OpenAPI specification has invalid required fields for rating comparison current')
		}
		def comparisonExamples = (((((paths.get('/api/v1/members/me/ratings/comparison') as Map).get('get') as Map)
				.get('responses') as Map).get('200') as Map).get('content') as Map)
				?.get('application/json')?.get('examples') as Map
		if (comparisonExamples == null || !comparisonExamples.keySet().containsAll(
				['library-rating-comparison', 'library-rating-comparison-null-boundary'])) {
			throw new GradleException('OpenAPI specification is missing normal and null-boundary rating comparison examples')
		}
		def comparisonExample = comparisonExamples.get('library-rating-comparison') as Map
		def comparisonExampleValue = comparisonExample?.get('value') as String
		def comparisonExampleResponse = new JsonSlurper().parseText(comparisonExampleValue) as Map
		def comparisonExampleIsbn13s = ['lower', 'current', 'higher'].collect { propertyName ->
			(comparisonExampleResponse.get(propertyName) as Map)?.get('isbn13')
		} as Set
		if (comparisonExampleIsbn13s.size() != 3 || comparisonExampleIsbn13s.contains(null)) {
			throw new GradleException('OpenAPI rating comparison example must use different books for lower, current, and higher')
		}

		def libraryItemSchema = dereferenceSchema(((((libraryPostOperation.get('responses') as Map).get('201') as Map)
				.get('content') as Map).get('application/json') as Map).get('schema'))
		def libraryItemProperties = libraryItemSchema?.get('properties') as Map
		def comparisonAuthors = ((comparisonProperties?.get('current') as Map)?.get('properties') as Map)?.get('authors') as Map
		if ((libraryItemProperties?.get('authors') as Map)?.get('items')?.get('type') != 'string'
				|| (libraryItemProperties?.get('translators') as Map)?.get('items')?.get('type') != 'string'
				|| comparisonAuthors?.get('items')?.get('type') != 'string') {
			throw new GradleException('OpenAPI specification has invalid string array item types for Library responses')
		}

		[
			['/api/v1/books/{bookId}/reviews', 'post'],
			['/api/v1/books/by-isbn/{isbn13}/reviews', 'post'],
			['/api/v1/reviews/{reviewId}/replies', 'post']
		].each { path, method ->
			def response = (((paths.get(path) as Map).get(method) as Map).get('responses') as Map)?.get('201') as Map
			def reviewLocationHeader = (response?.get('headers') as Map)?.get('Location') as Map
			if ((reviewLocationHeader?.get('schema') as Map)?.get('type') != 'string') {
				throw new GradleException("OpenAPI specification is missing Location header for ${method.toUpperCase()} ${path}")
			}
		}

		[
			'/api/v1/books/{bookId}/reviews',
			'/api/v1/reviews/{reviewId}/replies'
		].each { path ->
			def parameters = ((paths.get(path) as Map).get('get') as Map)?.get('parameters') as List
			def page = parameters?.find { parameter ->
				(parameter as Map)?.get('name') == 'page' && (parameter as Map)?.get('in') == 'query'
			} as Map
			if (page?.get('required') != true) {
				throw new GradleException("OpenAPI specification must require page query parameter for GET ${path}")
			}
		}
		def reviewFeedParameters = ((paths.get('/api/v1/books/{bookId}/reviews') as Map).get('get') as Map)
				.get('parameters') as List
		def feed = reviewFeedParameters?.find { parameter -> (parameter as Map)?.get('name') == 'feed' } as Map
		if (!feed?.get('description')?.toString()?.contains('MINE은 인증 필요')) {
			throw new GradleException('OpenAPI specification must describe authentication required for MINE review feed')
		}
		def operationDescription = { path, method ->
			return (((paths.get(path) as Map)?.get(method) as Map)?.get('description'))?.toString() ?: ''
		}
		[
			[path: '/api/v1/library/{bookId}', method: 'patch', phrases: ['status`와 `currentPage` 중 정확히 하나', 'WANT_TO_READ', 'FINISHED', 'INVALID_READING_STATE']],
			[path: '/api/v1/reviews/{reviewId}', method: 'patch', phrases: ['생략하면 기존 값을 유지', '`null`을 보내면 삭제', '`null`을 보낼 수 없습니다', '빈 객체는 허용되지 않습니다']],
			[path: '/api/v1/library', method: 'get', phrases: ['page`는 1부터 시작', '최대 10개', 'nextPage`는 `null', '빈 `items`']],
			[path: '/api/v1/books/{bookId}/reviews', method: 'get', phrases: ['POPULAR', '좋아요 수와 답글 수를 합산', 'page`는 1부터 시작', '빈 `items`']]
		].each { requirement ->
			def description = operationDescription(requirement.path, requirement.method)
			if (!requirement.phrases.every { phrase -> description.contains(phrase) }) {
				throw new GradleException("OpenAPI specification is missing client guidance for ${requirement.method.toUpperCase()} ${requirement.path}")
			}
		}
		[
			[path: '/api/v1/books', method: 'get', status: '200', names: ['search-registered-book', 'search-unregistered-book']],
			[path: '/api/v1/books/by-isbn/{isbn13}', method: 'get', status: '200', names: ['book-detail-without-library-record']],
			[path: '/api/v1/books/{bookId}/reviews', method: 'get', status: '200', names: ['review-normal', 'review-spoiler', 'review-deleted']]
		].each { requirement ->
			def operation = ((paths.get(requirement.path) as Map)?.get(requirement.method)) as Map
			def response = ((operation?.get('responses') as Map)?.get(requirement.status)) as Map
			def content = ((response?.get('content') as Map)?.get('application/json')) as Map
			def examples = content?.get('examples') as Map
			if (examples == null || !examples.keySet().containsAll(requirement.names)) {
				throw new GradleException("OpenAPI specification is missing selected client examples for ${requirement.method.toUpperCase()} ${requirement.path}")
			}
		}

		def components = specification?.get('components') as Map
		def schemas = components?.get('schemas') as Map
		def problemDetail = schemas?.get('ProblemDetail') as Map
		if (problemDetail == null) {
			throw new GradleException('OpenAPI specification is missing ProblemDetail schema')
		}
		def requiredProblemDetailFields = ['type', 'title', 'status', 'detail', 'instance', 'code'] as Set
		def problemDetailFields = (problemDetail.get('properties') as Map)?.keySet()
		if (problemDetailFields == null || !problemDetailFields.containsAll(requiredProblemDetailFields)) {
			throw new GradleException('OpenAPI specification has invalid ProblemDetail fields')
		}

		def servers = specification?.get('servers') as List
		def serverUrl = servers == null || servers.isEmpty()
				? null
				: (servers.first() as Map)?.get('url')
		if (serverUrl != '..') {
			throw new GradleException('OpenAPI specification must use relative server URL ..')
		}

		['database password leaked', 'invalid secret key'].each { forbiddenValue ->
			if (specificationText.contains(forbiddenValue)) {
				throw new GradleException("OpenAPI specification exposes forbidden value: ${forbiddenValue}")
			}
		}
	}
}

tasks.named('bootRun') {
	dependsOn stageOpenApiSpec
	classpath += files(swaggerRuntimeDir)
}

tasks.named('bootJar') {
	dependsOn stageOpenApiSpec
	from(swaggerRuntimeDir) {
		into 'BOOT-INF/classes'
	}
}

tasks.named('asciidoctor') {
	inputs.dir snippetsDir
	dependsOn test
}
